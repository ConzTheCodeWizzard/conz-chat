<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milzy Page</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
    }

    h1 {
        color: red;
        font-size: 3em;
        margin-bottom: 10px;
    }

    h2 {
        margin-bottom: 20px;
        font-weight: normal;
    }

    p {
        max-width: 600px;
        margin-bottom: 30px;
        opacity: 0.8;
    }

    button {
        padding: 15px 30px;
        font-size: 18px;
        background: red;
        border: none;
        color: white;
        cursor: pointer;
        border-radius: 8px;
        margin-bottom: 30px;
        transition: 0.3s;
    }

    button:hover {
        background: darkred;
        transform: scale(1.05);
    }

    .rotating-text {
        font-size: 20px;
        font-weight: bold;
        animation: colorChange 2s infinite;
    }

    @keyframes colorChange {
        0% { color: red; }
        25% { color: cyan; }
        50% { color: lime; }
        75% { color: yellow; }
        100% { color: red; }
    }
</style>
</head>

<body>

<h1>oh hello milzyjnr</h1>
<h2>Fancy seeing you here</h2>

<p>
This is a little something special just for you. Not everyone gets to see this… but you did. 
That probably means something. Or maybe it doesn’t. Either way, you're here now.
</p>

<p><strong>This special button is just for you</strong></p>

<button onclick="showMessage()">click me milzyjnr</button>

<div class="rotating-text" id="text"></div>

<script>
function showMessage() {
    alert("Jessica says\n\nBRO LOST 1,000 FIGHTS💀");
}

const messages = [
    "can you code like me?",
    "Nu uhhh",
    "I AM THE GOD OF CODING",
    "1,000 losses bruh?"
];

let index = 0;
const textElement = document.getElementById("text");

function rotateText() {
    textElement.textContent = messages[index];
    index = (index + 1) % messages.length;
}

setInterval(rotateText, 2000);
rotateText();
</script>

</body>
</html>
