<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Anniversary Page</title>

  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      background:
      linear-gradient(rgba(0,0,0,0.85), rgba(10,0,20,0.9)),
      url('https://images.unsplash.com/photo-1518709268805-4e9042af2176?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
      color:white;
      font-family:'Poppins', sans-serif;
      overflow-x:hidden;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px 20px;
    }

    .overlay{
      width:100%;
      max-width:900px;
      background:rgba(10,0,20,0.75);
      border:2px solid #8b2cff;
      border-radius:25px;
      padding:50px 30px;
      text-align:center;
      backdrop-filter: blur(8px);
      box-shadow:
      0 0 25px #7b2fff,
      0 0 60px rgba(123,47,255,0.4);
      position:relative;
      overflow:hidden;
    }

    .overlay::before{
      content:"";
      position:absolute;
      inset:0;
      background:
      repeating-linear-gradient(
        45deg,
        transparent,
        transparent 12px,
        rgba(255,255,255,0.03) 12px,
        rgba(255,255,255,0.03) 24px
      );
      pointer-events:none;
    }

    h1{
      font-family:'Creepster', cursive;
      font-size:5rem;
      color:#c77dff;
      text-shadow:
      0 0 10px #b84dff,
      0 0 25px #7b2fff,
      0 0 50px #7b2fff;
      margin-bottom:10px;
      animation: float 4s ease-in-out infinite;
      letter-spacing:3px;
    }

    h2{
      font-size:1.5rem;
      color:#ffffff;
      margin-bottom:40px;
      text-shadow:0 0 10px #bb66ff;
      font-weight:300;
    }

    .countdown-box{
      margin:25px auto;
      padding:25px;
      border-radius:20px;
      background:rgba(20,0,40,0.75);
      border:1px solid #a855f7;
      box-shadow:0 0 20px rgba(168,85,247,0.45);
      max-width:700px;
    }

    .countdown-title{
      font-size:1.6rem;
      color:#d8b4fe;
      margin-bottom:15px;
      font-weight:600;
      text-shadow:0 0 15px #9333ea;
    }

    .timer{
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
    }

    .time-box{
      background:black;
      border:1px solid #9333ea;
      border-radius:15px;
      padding:18px;
      min-width:100px;
      box-shadow:0 0 15px rgba(147,51,234,0.5);
    }

    .time-box span{
      display:block;
    }

    .number{
      font-size:2rem;
      font-weight:bold;
      color:#ffffff;
      text-shadow:0 0 12px #c084fc;
    }

    .label{
      font-size:0.9rem;
      color:#d8b4fe;
      margin-top:5px;
      letter-spacing:1px;
    }

    .love-text{
      margin-top:45px;
      min-height:80px;
      font-size:2rem;
      font-weight:600;
      animation: colorShift 4s linear infinite;
      text-shadow:
      0 0 10px currentColor,
      0 0 20px currentColor;
      transition:0.5s;
      padding:10px;
    }

    .moon{
      position:absolute;
      top:-60px;
      right:-60px;
      width:180px;
      height:180px;
      border-radius:50%;
      background:radial-gradient(circle, #ffffff 0%, #d8b4fe 40%, transparent 70%);
      opacity:0.15;
      filter:blur(3px);
    }

    @keyframes float{
      0%,100%{transform:translateY(0px);}
      50%{transform:translateY(-10px);}
    }

    @keyframes colorShift{
      0%{color:#ffffff;}
      25%{color:#c77dff;}
      50%{color:#9333ea;}
      75%{color:#e0aaff;}
      100%{color:#ffffff;}
    }

    @media(max-width:700px){
      h1{
        font-size:3.2rem;
      }

      h2{
        font-size:1.1rem;
      }

      .love-text{
        font-size:1.4rem;
      }

      .time-box{
        min-width:80px;
        padding:15px;
      }

      .number{
        font-size:1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="overlay">
    <div class="moon"></div>

    <h1>Anniversary Page</h1>

    <h2>I love you to the moon and back baby 🖤💜</h2>

    <!-- YEARLY -->
    <div class="countdown-box">
      <div class="countdown-title">🎃 Yearly Anniversary 🎃</div>

      <div class="timer" id="yearlyTimer">
        <div class="time-box">
          <span class="number" id="yDays">0</span>
          <span class="label">Days</span>
        </div>

        <div class="time-box">
          <span class="number" id="yHours">0</span>
          <span class="label">Hours</span>
        </div>

        <div class="time-box">
          <span class="number" id="yMinutes">0</span>
          <span class="label">Minutes</span>
        </div>

        <div class="time-box">
          <span class="number" id="ySeconds">0</span>
          <span class="label">Seconds</span>
        </div>
      </div>
    </div>

    <!-- MONTHLY -->
    <div class="countdown-box">
      <div class="countdown-title">🕸 Monthly Anniversary 🕸</div>

      <div class="timer" id="monthlyTimer">
        <div class="time-box">
          <span class="number" id="mDays">0</span>
          <span class="label">Days</span>
        </div>

        <div class="time-box">
          <span class="number" id="mHours">0</span>
          <span class="label">Hours</span>
        </div>

        <div class="time-box">
          <span class="number" id="mMinutes">0</span>
          <span class="label">Minutes</span>
        </div>

        <div class="time-box">
          <span class="number" id="mSeconds">0</span>
          <span class="label">Seconds</span>
        </div>
      </div>
    </div>

    <!-- ROTATING LOVE TEXT -->
    <div class="love-text" id="loveText">
      You're the love of my life
    </div>

  </div>

  <script>
    // YEARLY COUNTDOWN
    function updateYearlyCountdown() {
      const now = new Date();

      let targetYear = now.getFullYear();
      let targetDate = new Date(targetYear, 2, 7, 0, 0, 0);

      if (now > targetDate) {
        targetDate = new Date(targetYear + 1, 2, 7, 0, 0, 0);
      }

      const diff = targetDate - now;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("yDays").textContent = days;
      document.getElementById("yHours").textContent = hours;
      document.getElementById("yMinutes").textContent = minutes;
      document.getElementById("ySeconds").textContent = seconds;
    }

    // MONTHLY COUNTDOWN
    function updateMonthlyCountdown() {
      const now = new Date();

      let month = now.getMonth();
      let year = now.getFullYear();

      let targetDate = new Date(year, month, 7, 0, 0, 0);

      if (now > targetDate) {
        targetDate = new Date(year, month + 1, 7, 0, 0, 0);
      }

      const diff = targetDate - now;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("mDays").textContent = days;
      document.getElementById("mHours").textContent = hours;
      document.getElementById("mMinutes").textContent = minutes;
      document.getElementById("mSeconds").textContent = seconds;
    }

    setInterval(() => {
      updateYearlyCountdown();
      updateMonthlyCountdown();
    }, 1000);

    updateYearlyCountdown();
    updateMonthlyCountdown();

    // ROTATING LOVE TEXT
    const messages = [
      "You're the love of my life 🖤",
      "I couldn't imagine being with anyone else 💜",
      "You showed me the meaning of love 🌙",
      "I'm grateful for you forever 🎃"
    ];

    let index = 0;

    setInterval(() => {
      index = (index + 1) % messages.length;

      const text = document.getElementById("loveText");

      text.style.opacity = "0";

      setTimeout(() => {
        text.innerHTML = messages[index];
        text.style.opacity = "1";
      }, 500);

    }, 3500);
  </script>

</body>
</html>
