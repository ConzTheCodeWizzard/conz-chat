<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to ConzPing</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

body{
    margin:0;
    padding:0;

    background:black;
    color:#00ff88;

    font-family:'Orbitron', sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;

    background:
    radial-gradient(circle at top, rgba(0,255,100,0.15), transparent 40%),
    radial-gradient(circle at bottom, rgba(0,255,100,0.1), transparent 50%);

    z-index:-1;
}

.container{
    width:80%;
    max-width:900px;
    text-align:center;
}

h1{
    font-size:72px;
    margin-bottom:25px;

    text-shadow:
    0 0 5px #00ff88,
    0 0 15px #00ff88,
    0 0 35px #00ff88;
}

p{
    font-size:20px;
    line-height:1.8;
    color:#b6ffcf;

    margin-bottom:45px;
}

button{
    background:black;
    color:#00ff88;

    border:2px solid #00ff88;

    padding:18px 45px;

    font-size:22px;
    font-family:'Orbitron', sans-serif;

    border-radius:12px;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 0 10px #00ff88,
    inset 0 0 10px #00ff88;
}

button:hover{
    background:#00ff88;
    color:black;

    transform:scale(1.08);

    box-shadow:
    0 0 20px #00ff88,
    0 0 50px #00ff88;
}

</style>
</head>
<body>

<div class="container">

<h1>Welcome to ConzPing</h1>

<p>
Yea I got bored as hell and made a custom pinger we all been there guys...
its just so 2012 to be pinging with command prompt let's be real...
</p>

<button onclick="window.location.href='pinger.html'">
Use ConzPing
</button>

</div>

</body>
</html>
