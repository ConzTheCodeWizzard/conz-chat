<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
}

/* SCREENS */
.screen { display:none; height:100vh; }
.active { display:flex; flex-direction:column; }

/* HEADER */
.header {
  background:red;
  color:black;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}

/* BUTTONS */
button {
  width:100%;
  padding:14px;
  background:red;
  border:none;
  color:white;
  border-radius:8px;
  font-size:16px;
}

/* INPUTS */
input {
  width:100%;
  padding:12px;
  margin:8px 0;
  background:black;
  border:1px solid red;
  color:white;
  border-radius:6px;
}

/* CHAT LIST */
.chatItem {
  padding:15px;
  border-bottom:1px solid #222;
}

.preview {
  font-size:12px;
  color:gray;
}

/* CHAT */
#messages {
  flex:1;
  overflow:auto;
  padding:10px;
}

.me { text-align:right; }
.other { text-align:left; }

.bubble {
  display:inline-block;
  padding:10px;
  margin:5px;
  border-radius:12px;
  background:red;
}
</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active" style="justify-content:space-between;align-items:center;text-align:center;padding:30px;">

  <div style="margin-top:60px;">
    <h1 style="color:red;font-size:22px;margin:0;">Welcome to</h1>
    <h1 style="color:red;font-size:42px;margin:5px 0;">ConzChat</h1>
    <p style="opacity:0.7;">Built from the ground up by Conz</p>
  </div>

  <div style="width:100%;max-width:300px;">
    <button onclick="show('login')" style="margin-bottom:15px;">Login</button>
    <button onclick="show('signup')">Create Account</button>
  </div>

  <p style="font-size:12px;opacity:0.6;">~ Developed By Conz ~</p>
</div>

<!-- LOGIN -->
<div id="login" class="screen" style="justify-content:center;padding:20px;">
  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <button onclick="show('welcome')">Back</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen" style="justify-content:center;padding:20px;">
  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password" placeholder="Password">
  <button onclick="signup()">Create</button>
  <button onclick="show('welcome')">Back</button>
</div>

<!-- MAIN APP -->
<div id="app" class="screen">

  <div class="header">
    <span onclick="openProfile()">👤</span>
    <span>ConzChat</span>
    <span onclick="openAdd()">➕</span>
  </div>

  <div id="chatList"></div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  projectId: "conzchat"
});

const db = firebase.firestore();

let currentUser = "";
let currentChat = "";

/* NAV */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* SIGNUP */
async function signup(){
  let u = su_user.value;
  let p = su_pass.value;

  let snap = await db.collection("users").where("username","==",u).get();
  if(!snap.empty){ alert("Username taken"); return; }

  await db.collection("users").add({ username:u, password:p });

  currentUser = u;
  show("app");
  loadChats();
}

/* LOGIN */
async function login(){
  let snap = await db.collection("users")
    .where("username","==",li_user.value)
    .where("password","==",li_pass.value)
    .get();

  if(snap.empty){ alert("Login failed"); return; }

  currentUser = li_user.value;
  show("app");
  loadChats();
}

/* CHAT LIST */
function loadChats(){
  db.collection("messages").orderBy("time")
  .onSnapshot(snap=>{
    let chats = {};

    snap.forEach(doc=>{
      let m = doc.data();
      if(m.from===currentUser) chats[m.to]=m.text;
      if(m.to===currentUser) chats[m.from]=m.text;
    });

    chatList.innerHTML="";

    Object.keys(chats).forEach(u=>{
      chatList.innerHTML += `
        <div class="chatItem" onclick="openChat('${u}')">
          <div>${u}</div>
          <div class="preview">${chats[u]}</div>
        </div>
      `;
    });
  });
}

/* OPEN CHAT */
function openChat(user){
  currentChat = user;

  app.innerHTML = `
    <div class="header">
      <span onclick="show('app')">⬅</span>
      <span>${user}</span>
      <span></span>
    </div>

    <div id="messages"></div>

    <div style="display:flex;">
      <input id="msg" style="flex:1;">
      <button onclick="send()">Send</button>
    </div>
  `;

  loadMessages();
}

/* SEND */
async function send(){
  if(!msg.value) return;

  await db.collection("messages").add({
    from:currentUser,
    to:currentChat,
    text:msg.value,
    time:Date.now(),
    status:"S"
  });

  msg.value="";
}

/* LOAD MESSAGES */
function loadMessages(){
  db.collection("messages").orderBy("time")
  .onSnapshot(snap=>{
    messages.innerHTML="";

    snap.forEach(doc=>{
      let m = doc.data();

      if(
        (m.from===currentUser && m.to===currentChat) ||
        (m.from===currentChat && m.to===currentUser)
      ){
        let side = m.from===currentUser ? "me" : "other";

        messages.innerHTML += `
          <div class="${side}">
            <div class="bubble">${m.text}</div>
          </div>
        `;
      }
    });
  });
}

/* ADD FRIEND */
function openAdd(){
  app.innerHTML = `
    <div class="header">
      <span onclick="show('app')">⬅</span>
      <span>Add Friend</span>
      <span></span>
    </div>

    <input id="searchUser" placeholder="Username">
    <button onclick="findUser()">Search</button>

    <div id="results"></div>
  `;
}

async function findUser(){
  let snap = await db.collection("users")
    .where("username","==",searchUser.value)
    .get();

  results.innerHTML="";

  if(snap.empty){
    results.innerHTML="User not found";
    return;
  }

  snap.forEach(doc=>{
    let u = doc.data();

    results.innerHTML += `
      <div class="chatItem" onclick="openChat('${u.username}')">
        ${u.username}
      </div>
    `;
  });
}

/* PROFILE */
function openProfile(){
  app.innerHTML = `
    <div class="header">
      <span onclick="show('app')">⬅</span>
      <span>Profile</span>
      <span></span>
    </div>

    <div style="padding:20px;text-align:center;">
      <h2>${currentUser}</h2>
      <p>@${currentUser}</p>
    </div>
  `;
}
</script>

</body>
</html>
