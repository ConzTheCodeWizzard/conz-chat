<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active welcomeScreen">
  <canvas id="particles"></canvas>

  <div class="welcomeContent">
    <h2>Welcome to</h2>
    <h1 class="logo">ConzChatV2</h1>

    <div id="rotatingText"></div>
    <button onclick="alert(typeof show)">TEST JS</button>
    <div>Version 1.3</div>

    <button onclick="show('login')">Login</button>
    <button onclick="show('signup')">Create Account</button>
  </div>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <input id="loginEmail" placeholder="Email">
  <input id="loginPassword" type="password">
  <button onclick="login()">Login</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen">
  <input id="signupUsername" placeholder="Username">
  <input id="signupEmail" placeholder="Email">
  <input id="signupPassword" type="password">
  <button onclick="signup()">Create</button>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <div class="topbar">
    <button onclick="logout()">Logout</button>
    <span>ConzChat</span>
    <span id="profileBtn" onclick="openProfile()">👤</span>
  </div>

  <div id="chatList"></div>

  <div id="fab" onclick="toggleFab()">+</div>

  <div id="fabMenu">
    <div onclick="openSearch()">Find Friends</div>
    <div onclick="show('updates')">Update Log</div>
  </div>
</div>

<!-- SEARCH -->
<div id="search" class="screen">
  <div class="topbar">
    <button onclick="show('home')">Back</button>
    <span>Search</span>
  </div>

  <input oninput="searchUsers()" placeholder="Search...">
  <div id="results"></div>
</div>

<!-- CHAT -->
<div id="chat" class="screen">

  <div class="topbar">
    <button onclick="show('home')">Back</button>
    <span id="chatName"></span>
  </div>

  <div id="messages"></div>

  <!-- 🔥 THIS IS WHAT YOU WERE MISSING -->
  <div class="chatInputBar">
    <input id="msgInput" placeholder="Type a message...">
    <div id="sendBtn" class="sendText" onclick="sendMessage()">Send</div>
  </div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">
  <div class="topbar">
    <button onclick="show('home')">Back</button>
    <span>Profile</span>
  </div>

  <div id="profileContent"></div>
</div>

<!-- UPDATES -->
<div id="updates" class="screen">
  <div class="topbar">
    <button onclick="show('home')">Back</button>
    <span>Updates</span>
  </div>

  <p>UI upgraded</p>
</div>

<input type="file" id="filePicker" style="display:none">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>
<script src="particles.js"></script>
<script src="app.js"></script>

</body>
</html>
