<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body { margin:0; font-family:Arial; background:black; color:white; }

/* SCREENS */
.screen { display:none; padding:15px; }
.active { display:block; }

/* BUTTONS */
button {
  width:100%;
  padding:12px;
  margin:8px 0;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
}

/* INPUTS */
input {
  width:100%;
  padding:10px;
  margin:5px 0;
  background:black;
  border:1px solid red;
  color:white;
}

/* HEADER */
.header {
  background:red;
  color:black;
  padding:15px;
  text-align:center;
  font-weight:bold;
  position:relative;
}

/* PROFILE ICON */
.profileIcon {
  position:absolute;
  left:10px;
  top:8px;
  width:35px;
  height:35px;
  border-radius:50%;
  background:white;
}

/* CHAT LIST */
.chatItem {
  padding:12px;
  border-bottom:1px solid red;
}

/* MESSAGES */
#messages {
  height:300px;
  overflow-y:auto;
  padding:10px;
}

.chatBubbleMe {
  background:red;
  padding:8px;
  margin:5px;
  text-align:right;
  border-radius:10px;
  width:fit-content;
  margin-left:auto;
}

.chatBubbleOther {
  background:#222;
  padding:8px;
  margin:5px;
  border-radius:10px;
  width:fit-content;
}

.status {
  font-size:10px;
  color:white;
}
</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <h1 style="color:red;text-align:center;">Welcome to ConzChat</h1>

  <button onclick="show('login')">Login</button>
  <button onclick="show('signup')">Create Account</button>

  <p style="text-align:center;font-size:12px;">~ Developed By Conz ~</p>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen">
  <h2>Create Account</h2>

  <input id="su_name" placeholder="Name">
  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password" placeholder="Password">
  <input id="su_dob" type="date">

  <button onclick="signup()">Create</button>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <h2>Login</h2>

  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password">

  <button onclick="login()">Login</button>
</div>

<!-- CHAT LIST -->
<div id="chatList" class="screen">
  <div class="header">
    <div class="profileIcon"></div>
    ConzChat
  </div>

  <div id="chatUsers"></div>

  <button onclick="show('find')">+ Find Friend</button>
</div>

<!-- FIND USER -->
<div id="find" class="screen">
  <h2>Find User</h2>

  <input id="search" placeholder="Username">
  <button onclick="findUser()">Search</button>

  <div id="results"></div>
</div>

<!-- CHAT -->
<div id="chat" class="screen">
  <div class="header" id="chatHeader"></div>

  <div id="messages"></div>

  <input id="msg">
  <button onclick="send()">Send</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs,
  query, where, onSnapshot, orderBy, updateDoc, doc
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  authDomain:"conzchat.firebaseapp.com",
  projectId:"conzchat"
});

const db = getFirestore(app);

let currentUser="";
let currentChat="";

/* NAV */
window.show = id=>{
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
};

/* SIGNUP */
window.signup = async ()=>{
  let name = su_name.value;
  let u = su_user.value;
  let p = su_pass.value;
  let dob = new Date(su_dob.value);

  let age = new Date().getFullYear() - dob.getFullYear();
  if(age < 13){ alert("You are not old enough"); return; }

  let q = query(collection(db,"users"),where("username","==",u));
  let snap = await getDocs(q);
  if(!snap.empty){ alert("Username taken"); return; }

  await addDoc(collection(db,"users"),{
    name, username:u, password:p,
    created:Date.now()
  });

  currentUser = u;
  loadChats();
  show("chatList");
};

/* LOGIN */
window.login = async ()=>{
  let q = query(collection(db,"users"),
    where("username","==",li_user.value),
    where("password","==",li_pass.value)
  );

  let snap = await getDocs(q);
  if(snap.empty){ alert("Incorrect"); return; }

  currentUser = li_user.value;
  loadChats();
  show("chatList");
};

/* FIND */
window.findUser = async ()=>{
  let q = query(collection(db,"users"),where("username","==",search.value));
  let snap = await getDocs(q);

  results.innerHTML="";
  if(snap.empty){ results.innerHTML="User doesn't exist"; return; }

  snap.forEach(doc=>{
    let u=doc.data();
    results.innerHTML+=`
      <div class="chatItem" onclick="openChat('${u.username}')">
        ${u.name} (@${u.username})
      </div>`;
  });
};

/* OPEN CHAT */
window.openChat = user=>{
  currentChat=user;
  chatHeader.innerText=user;
  show("chat");
  loadMessages();
};

/* SEND */
window.send = async ()=>{
  if(!msg.value) return;

  await addDoc(collection(db,"messages"),{
    from:currentUser,
    to:currentChat,
    text:msg.value,
    time:Date.now(),
    status:"S"
  });

  msg.value="";
};

/* LOAD MESSAGES */
function loadMessages(){
  let q=query(collection(db,"messages"),orderBy("time"));

  onSnapshot(q,snap=>{
    messages.innerHTML="";

    snap.forEach(async d=>{
      let m=d.data();

      if(
        (m.from===currentUser && m.to===currentChat) ||
        (m.from===currentChat && m.to===currentUser)
      ){
        let cls = m.from===currentUser ? "chatBubbleMe" : "chatBubbleOther";

        if(m.to===currentUser && m.status==="S"){
          await updateDoc(doc(db,"messages",d.id),{status:"D"});
        }

        let status = m.from===currentUser ? ` <span class="status">(${m.status})</span>` : "";

        messages.innerHTML+=`<div class="${cls}">${m.text}${status}</div>`;
      }
    });

    messages.scrollTop = messages.scrollHeight;
  });
}

/* LOAD CHAT LIST */
function loadChats(){
  let q=query(collection(db,"messages"),orderBy("time"));

  onSnapshot(q,snap=>{
    let chats={};

    snap.forEach(doc=>{
      let m=doc.data();

      if(m.from===currentUser || m.to===currentUser){
        let other = m.from===currentUser ? m.to : m.from;
        chats[other]=m;
      }
    });

    chatUsers.innerHTML="";

    Object.keys(chats).reverse().forEach(u=>{
      chatUsers.innerHTML+=`
        <div class="chatItem" onclick="openChat('${u}')">
          ${u}
        </div>`;
    });
  });
}
</script>

</body>
</html>
