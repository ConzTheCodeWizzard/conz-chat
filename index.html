<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="screen active">
  <h1>ConzChat</h1>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="signup()">Create Account</button>
</div>

<!-- HOME -->
<div id="home" class="screen">

  <div class="topbar">
    <div>ConzChat</div>
    <div onclick="openProfile()">👤</div>
  </div>

  <div id="chatList"></div>

  <div class="fab" onclick="openSearch()">+</div>

</div>

<!-- SEARCH -->
<div id="search" class="screen">
  <div class="topbar">
    <div onclick="show('home')">←</div>
    <div>Find People</div>
  </div>

  <input id="searchInput" placeholder="Search username..." oninput="searchUsers()">
  <div id="results"></div>
</div>

<!-- CHAT -->
<div id="chat" class="screen">
  <div class="topbar">
    <div onclick="show('home')">←</div>
    <div id="chatName"></div>
  </div>

  <div id="messages" class="chatBox"></div>

  <div class="msgInput">
    <input id="msg" placeholder="Message...">
    <button onclick="send()">Send</button>
  </div>
</div>

<!-- PROFILE -->
<div id="profile" class="screen">
  <div class="topbar">
    <div onclick="show('home')">←</div>
    <div>Profile</div>
  </div>

  <h2 id="profileName"></h2>
  <button onclick="logout()">Logout</button>
</div>

<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
</html>
