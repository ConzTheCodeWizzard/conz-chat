<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff0000">

<style>
body { margin:0; font-family:Arial; background:black; color:white; }

.screen { display:none; height:100vh; flex-direction:column; }
.active { display:flex; }

/* WELCOME */
#welcome {
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:20px;
  text-align:center;
}
.logo { font-size:42px; color:red; }

/* HEADER */
.header {
  background:red;
  color:black;
  padding:12px;
  display:flex;
  justify-content:space-between;
}

/* LIST */
.listItem {
  padding:15px;
  border-bottom:1px solid #222;
}

/* CHAT */
#messages { flex:1; overflow:auto; padding:10px; }

.me { text-align:right; }
.me div { background:red; padding:10px; border-radius:10px; display:inline-block; }

.other { text-align:left; }
.other div { background:#222; padding:10px; border-radius:10px; display:inline-block; }

/* INPUT */
.inputBar {
  display:flex;
  padding:10px;
}
.inputBar input {
  flex:1;
  padding:12px;
  border-radius:20px;
  border:1px solid red;
  background:black;
  color:white;
}

button {
  padding:12px;
  background:red;
  border:none;
  color:white;
  margin:5px;
}

input {
  padding:12px;
  margin:5px 0;
  background:black;
  border:1px solid red;
  color:white;
}
</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <div>
    <h2 style="color:red;">Welcome to</h2>
    <div class="logo">ConzChat</div>
    <p>Built by Conz</p>
  </div>

  <div>
    <button onclick="show('login')">Login</button>
    <button onclick="show('signup')">Create Account</button>
  </div>

  <div>~ Developed by Conz ~</div>
</div>

<!-- LOGIN -->
<div id="login" class="screen" style="padding:20px;">
  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen" style="padding:20px;">
  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password" placeholder="Password">
  <button onclick="signup()">Create</button>
</div>

<!-- APP -->
<div id="app" class="screen">
  <div class="header">
    <span onclick="show('welcome')">⬅</span>
    <span>ConzChat</span>
    <span onclick="alert(currentUser)">👤</span>
  </div>

  <div id="content"></div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  projectId:"conzchat"
});

const db = firebase.firestore();

let currentUser = "";

/* NAV */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* SIGNUP */
async function signup(){
  let u = su_user.value;
  let p = su_pass.value;

  let check = await db.collection("users").where("username","==",u).get();
  if(!check.empty){ alert("Username taken"); return; }

  await db.collection("users").add({
    username:u,
    password:p,
    created:Date.now()
  });

  currentUser = u;
  openChats();
}

/* LOGIN */
async function login(){
  let u = li_user.value;
  let p = li_pass.value;

  let snap = await db.collection("users")
    .where("username","==",u)
    .where("password","==",p)
    .get();

  if(snap.empty){ alert("Login failed"); return; }

  currentUser = u;
  openChats();
}

/* CHAT LIST */
function openChats(){
  show("app");

  db.collection("users").onSnapshot(snap=>{
    content.innerHTML="";

    snap.forEach(doc=>{
      let u = doc.data();

      if(u.username !== currentUser){
        content.innerHTML += `
        <div class="listItem" onclick="openChat('${u.username}')">
          ${u.username}
        </div>`;
      }
    });
  });
}

/* CHAT */
function chatId(a,b){ return [a,b].sort().join("_"); }

function openChat(user){
  content.innerHTML = `
    <div id="messages"></div>
    <div class="inputBar">
      <input id="msg">
      <button onclick="send('${user}')">Send</button>
    </div>
  `;

  let id = chatId(currentUser,user);

  db.collection("messages").doc(id).collection("msgs")
  .orderBy("time").onSnapshot(snap=>{
    messages.innerHTML="";

    snap.forEach(doc=>{
      let m = doc.data();
      let side = m.from===currentUser ? "me" : "other";

      messages.innerHTML += `
        <div class="${side}">
          <div>${m.text}</div>
        </div>`;
    });

    messages.scrollTop = messages.scrollHeight;
  });
}

async function send(user){
  if(!msg.value) return;

  let id = chatId(currentUser,user);

  await db.collection("messages").doc(id).collection("msgs").add({
    from:currentUser,
    text:msg.value,
    time:Date.now()
  });

  msg.value="";
}
</script>

<!-- SERVICE WORKER -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
