<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body { margin:0; font-family:Arial; background:black; color:white; }
.screen { display:none; height:100vh; flex-direction:column; }
.active { display:flex; }

.header {
  background:red;
  color:black;
  padding:12px;
  display:flex;
  justify-content:space-between;
}

button {
  background:red;
  border:none;
  color:white;
  padding:12px;
  margin:5px;
}

input {
  padding:12px;
  margin:5px;
  background:black;
  border:1px solid red;
  color:white;
}

#welcome {
  justify-content:space-between;
  text-align:center;
  padding:20px;
}

.logo {
  font-size:48px;
  color:red;
}

</style>
</head>

<body>

<div id="errorBox" style="color:red;text-align:center;"></div>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <div>
    <h2 style="color:red;">Welcome to</h2>
    <div class="logo">ConzChat</div>
  </div>

  <div>
    <button onclick="nav('login')">Login</button>
    <button onclick="nav('signup')">Create Account</button>
  </div>

  <div>~ Developed By Conz ~</div>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <div class="header">
    <span onclick="nav('welcome')">⬅</span>
    Login
    <span></span>
  </div>

  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password">
  <button onclick="login()">Login</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen">
  <div class="header">
    <span onclick="nav('welcome')">⬅</span>
    Create
    <span></span>
  </div>

  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password">
  <button onclick="signup()">Create</button>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <div class="header">
    <span onclick="nav('welcome')">⬅</span>
    ConzChat
    <span></span>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
try {

firebase.initializeApp({
  apiKey:"AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  projectId:"conzchat"
});

const auth = firebase.auth();

/* NAV */
window.nav = function(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* SIGNUP */
window.signup = async function(){
  try {
    let u = document.getElementById("su_user").value;
    let p = document.getElementById("su_pass").value;

    await auth.createUserWithEmailAndPassword(u+"@app.com", p);
    nav("home");
  } catch(e){
    showError(e.message);
  }
}

/* LOGIN */
window.login = async function(){
  try {
    let u = document.getElementById("li_user").value;
    let p = document.getElementById("li_pass").value;

    await auth.signInWithEmailAndPassword(u+"@app.com", p);
    nav("home");
  } catch(e){
    showError(e.message);
  }
}

/* ERROR DISPLAY */
function showError(msg){
  document.getElementById("errorBox").innerText = msg;
}

} catch(e){
  document.getElementById("errorBox").innerText = "Script crashed: "+e.message;
}
</script>

</body>
</html>
