<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body { margin:0; font-family:Arial; background:black; color:white; }
.screen { display:none; height:100vh; flex-direction:column; }
.active { display:flex; }

/* HEADER */
.header {
  background:red;
  color:black;
  padding:12px;
  display:flex;
  justify-content:space-between;
}

/* BUTTON */
button {
  background:red;
  border:none;
  color:white;
  padding:12px;
  margin:5px;
}

/* INPUT */
input {
  padding:12px;
  margin:5px;
  background:black;
  border:1px solid red;
  color:white;
}

/* CHAT */
#messages { flex:1; overflow:auto; padding:10px; }

.me { text-align:right; }
.me div { background:red; padding:10px; border-radius:10px; display:inline-block; }

.other { text-align:left; }
.other div { background:#222; padding:10px; border-radius:10px; display:inline-block; }

.inputBar { display:flex; }
.inputBar input { flex:1; }

/* LIST */
.user { padding:12px; border-bottom:1px solid #222; }
</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active" style="justify-content:center;align-items:center;">
  <h1 style="color:red;">ConzChat</h1>
  <button onclick="show('login')">Login</button>
  <button onclick="show('signup')">Create Account</button>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password">
  <button onclick="login()">Login</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen">
  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password">
  <button onclick="signup()">Create</button>
</div>

<!-- APP -->
<div id="app" class="screen">
  <div class="header">
    <span onclick="logout()">⬅</span>
    <span>ConzChat</span>
    <span onclick="loadUsers()">＋</span>
  </div>

  <div id="content"></div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  projectId:"conzchat"
});

const db = firebase.firestore();
const auth = firebase.auth();

let currentUser="";
let currentChat="";

/* NAV */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* AUTH */
async function signup(){
  let username = su_user.value;
  let email = username+"@conz.app";

  let res = await auth.createUserWithEmailAndPassword(email, su_pass.value);

  await db.collection("users").doc(res.user.uid).set({
    username
  });

  currentUser = res.user.uid;
  openChats();
}

async function login(){
  let email = li_user.value+"@conz.app";

  let res = await auth.signInWithEmailAndPassword(email, li_pass.value);

  currentUser = res.user.uid;
  openChats();
}

function logout(){
  auth.signOut();
  show("welcome");
}

/* CHAT LIST */
function openChats(){
  show("app");

  db.collection("users").onSnapshot(snap=>{
    content.innerHTML="";

    snap.forEach(doc=>{
      let u = doc.data();
      if(doc.id !== currentUser){
        content.innerHTML += `
          <div class="user" onclick="openChat('${doc.id}','${u.username}')">
            ${u.username}
          </div>
        `;
      }
    });
  });
}

/* CHAT */
function chatId(a,b){ return [a,b].sort().join("_"); }

function openChat(uid,name){
  currentChat = uid;

  content.innerHTML = `
    <div id="messages"></div>
    <div class="inputBar">
      <input id="msg">
      <button onclick="send()">Send</button>
    </div>
  `;

  let id = chatId(currentUser,uid);

  db.collection("messages").doc(id).collection("msgs")
  .orderBy("time").onSnapshot(snap=>{
    messages.innerHTML="";

    snap.forEach(doc=>{
      let m = doc.data();
      let cls = m.from===currentUser ? "me":"other";

      messages.innerHTML += `
        <div class="${cls}">
          <div>${m.text}</div>
        </div>
      `;
    });

    messages.scrollTop = messages.scrollHeight;
  });
}

/* SEND */
async function send(){
  if(!msg.value) return;

  let id = chatId(currentUser,currentChat);

  await db.collection("messages").doc(id).collection("msgs").add({
    from:currentUser,
    text:msg.value,
    time:Date.now()
  });

  msg.value="";
}
</script>

</body>
</html>
