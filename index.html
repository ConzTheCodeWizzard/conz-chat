<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body { margin:0; font-family:Arial; background:black; color:white; }

.screen { display:none; height:100vh; padding:20px; }
.active { display:flex; flex-direction:column; }

.center {
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

button {
  width:80%;
  padding:14px;
  margin:10px;
  background:red;
  border:none;
  color:white;
  font-weight:bold;
}

input {
  width:90%;
  padding:10px;
  margin:5px;
  background:black;
  border:1px solid red;
  color:white;
}

.header {
  background:red;
  color:black;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

.chatItem {
  padding:12px;
  border-bottom:1px solid red;
}

#messages {
  flex:1;
  overflow-y:auto;
}

.chatBubbleMe {
  background:red;
  padding:8px;
  margin:5px;
  border-radius:10px;
  margin-left:auto;
}

.chatBubbleOther {
  background:#222;
  padding:8px;
  margin:5px;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <div class="center">
    <h1 style="color:red;">ConzChat</h1>
    <button onclick="show('login')">Login</button>
    <button onclick="show('signup')">Create Account</button>
  </div>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen">
  <div class="center">
    <input id="su_email" placeholder="Email">
    <input id="su_pass" type="password" placeholder="Password">
    <input id="su_name" placeholder="Display Name">
    <button onclick="signup()">Create</button>
  </div>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <div class="center">
    <input id="li_email" placeholder="Email">
    <input id="li_pass" type="password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- CHAT LIST -->
<div id="chatList" class="screen">
  <div class="header">ConzChat</div>
  <div id="chatUsers"></div>
</div>

<!-- CHAT -->
<div id="chat" class="screen">
  <div class="header" id="chatHeader"></div>
  <div id="messages"></div>
  <input id="msg">
  <button onclick="send()">Send</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc,
  collection, addDoc, query, onSnapshot, orderBy
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  authDomain:"conzchat.firebaseapp.com",
  projectId:"conzchat"
});

const auth = getAuth(app);
const db = getFirestore(app);

let currentUser=null;
let currentChat=null;

/* NAV */
window.show=id=>{
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
};

/* AUTH STATE */
onAuthStateChanged(auth, async user=>{
  if(user){
    currentUser=user;
    show("chatList");
    loadChats();
  } else {
    show("welcome");
  }
});

/* SIGNUP */
window.signup = async ()=>{
  let res = await createUserWithEmailAndPassword(auth, su_email.value, su_pass.value);

  await setDoc(doc(db,"users",res.user.uid),{
    name:su_name.value,
    created:Date.now()
  });
};

/* LOGIN */
window.login = async ()=>{
  await signInWithEmailAndPassword(auth, li_email.value, li_pass.value);
};

/* CHAT ID */
function getChatId(a,b){
  return [a,b].sort().join("_");
}

/* LOAD CHAT LIST */
function loadChats(){
  let q=query(collection(db,"chats"),orderBy("lastTime"));

  onSnapshot(q, snap=>{
    chatUsers.innerHTML="";

    snap.forEach(docSnap=>{
      let c=docSnap.data();

      if(c.users.includes(currentUser.uid)){
        let other = c.users.find(u=>u!==currentUser.uid);

        chatUsers.innerHTML+=`
          <div class="chatItem" onclick="openChat('${other}')">
            Chat with ${other.substring(0,6)}
          </div>`;
      }
    });
  });
}

/* OPEN CHAT */
window.openChat = uid=>{
  currentChat=uid;
  chatHeader.innerText="Chat";
  show("chat");
  loadMessages();
};

/* SEND */
window.send = async ()=>{
  let chatId=getChatId(currentUser.uid,currentChat);

  await addDoc(collection(db,"chats",chatId,"messages"),{
    from:currentUser.uid,
    text:msg.value,
    time:Date.now()
  });

  await setDoc(doc(db,"chats",chatId),{
    users:[currentUser.uid,currentChat],
    lastTime:Date.now()
  });

  msg.value="";
};

/* LOAD MESSAGES */
function loadMessages(){
  let chatId=getChatId(currentUser.uid,currentChat);

  let q=query(collection(db,"chats",chatId,"messages"),orderBy("time"));

  onSnapshot(q, snap=>{
    messages.innerHTML="";

    snap.forEach(doc=>{
      let m=doc.data();
      let cls = m.from===currentUser.uid ? "chatBubbleMe" : "chatBubbleOther";
      messages.innerHTML+=`<div class="${cls}">${m.text}</div>`;
    });
  });
}
</script>

</body>
</html>
