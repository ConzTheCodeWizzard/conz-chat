<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
  text-align:center;
}

h1 { color:red; margin-top:50px; }

button {
  width:80%;
  padding:15px;
  margin:10px;
  background:red;
  border:none;
  color:white;
}

input {
  width:80%;
  padding:10px;
  margin:5px;
  background:black;
  border:1px solid red;
  color:white;
}
</style>
</head>

<body>

<h1>Welcome to ConzChat</h1>

<div id="home">
  <button onclick="show('login')">Login</button>
  <button onclick="show('signup')">Create Account</button>
  <p style="font-size:12px;">~ Developed By Conz ~</p>
</div>

<div id="signup" style="display:none;">
  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password" placeholder="Password">
  <input id="su_dob" type="date">
  <button onclick="signup()">Create</button>
</div>

<div id="login" style="display:none;">
  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password">
  <button onclick="login()">Login</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSy...",
  authDomain:"conzchat.firebaseapp.com",
  projectId:"conzchat"
});

const db = getFirestore(app);

window.show = id=>{
  home.style.display="none";
  signup.style.display="none";
  login.style.display="none";
  document.getElementById(id).style.display="block";
};

window.signup = async ()=>{
  let u=su_user.value;
  let p=su_pass.value;
  let dob=new Date(su_dob.value);

  let age=new Date().getFullYear()-dob.getFullYear();
  if(age<13){ alert("Too young"); return; }

  let q=query(collection(db,"users"),where("username","==",u));
  let snap=await getDocs(q);

  if(!snap.empty){ alert("Username taken"); return; }

  await addDoc(collection(db,"users"),{
    username:u,
    password:p,
    created:Date.now()
  });

  localStorage.setItem("user",u);
  window.location.href="app.html";
};

window.login = async ()=>{
  let u=li_user.value;
  let p=li_pass.value;

  let q=query(collection(db,"users"),
    where("username","==",u),
    where("password","==",p)
  );

  let snap=await getDocs(q);

  if(snap.empty){ alert("Incorrect"); return; }

  localStorage.setItem("user",u);
  window.location.href="app.html";
};
</script>

</body>
</html>
