<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">

  <div class="topbar">
    <div class="logo">ConzChat</div>
    <div class="profileBtn" onclick="openMyProfile()">👤</div>
  </div>

  <div class="homeContent">
    <h3>Explore Public Groups</h3>
    <p>Make friends with similar interests</p>
    <button class="outline">FIND A GROUP</button>
  </div>

  <!-- FLOAT BUTTON -->
  <div class="fab" onclick="toggleFab()">+</div>

  <!-- FAB MENU -->
  <div id="fabMenu">
    <div onclick="openSearch()">Find People</div>
    <div onclick="openSearch()">Start Chat</div>
    <div>Public Groups</div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottomNav">
    <div class="active">Chat</div>
    <div>Live</div>
    <div>Ad-Free</div>
  </div>

</div>

<!-- CHAT -->
<div id="chat" class="screen">

  <div class="topbar">
    <div onclick="show('home')">←</div>
    <div id="chatName"></div>
  </div>

  <div id="messages" class="chatBox"></div>

  <div class="msgInput">
    <input id="msg" placeholder="Message...">
    <button onclick="send()">Send</button>
  </div>

</div>

<!-- SEARCH -->
<div id="search" class="screen">
  <div class="topbar">
    <div onclick="show('home')">←</div>
    <div>Find People</div>
  </div>

  <input id="searchInput" placeholder="Search..." oninput="searchUsers()">
  <div id="results"></div>
</div>

<!-- PROFILE -->
<div id="profile" class="screen">

  <div class="topbar">
    <div onclick="show('home')">←</div>
    <div>Settings</div>
  </div>

  <div class="profileTop">
    <div id="profilePic">👤</div>
    <h2 id="profileName"></h2>
    <p>@username</p>
  </div>

  <textarea id="bioInput"></textarea>

  <button onclick="saveProfile()">Save</button>

</div>

<script src="firebase.js"></script>
<script src="app.js"></script>

<script>
function toggleFab(){
  fabMenu.classList.toggle("open");
}
</script>

</body>
</html>
