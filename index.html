<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body { margin:0; font-family:Arial; background:black; color:white; }

.screen { display:none; height:100vh; flex-direction:column; }
.active { display:flex; }

/* HEADER */
.header {
  background:red;
  color:black;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* WELCOME */
#welcome {
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:20px;
  text-align:center;
}
.logo { font-size:42px; color:red; }

/* LIST */
.listItem {
  padding:15px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  gap:10px;
}
.avatar {
  width:45px;
  height:45px;
  border-radius:50%;
  background:#333;
}

/* CHAT */
#messages { flex:1; overflow:auto; padding:10px; }

.bubble {
  padding:10px;
  border-radius:10px;
  margin:5px;
  max-width:70%;
}
.me { text-align:right; }
.me .bubble { background:red; }
.other { text-align:left; }
.other .bubble { background:#222; }

/* INPUT */
.inputBar {
  display:flex;
  padding:10px;
  gap:8px;
}
.inputBar input {
  flex:1;
  padding:12px;
  border-radius:20px;
  border:1px solid red;
  background:black;
  color:white;
}

/* PROFILE */
.profilePic {
  width:90px;
  height:90px;
  border-radius:50%;
  background:#333;
  margin:20px auto;
  object-fit:cover;
}

button {
  padding:12px;
  background:red;
  border:none;
  color:white;
  margin-top:5px;
}

input {
  padding:12px;
  margin:5px 0;
  background:black;
  border:1px solid red;
  color:white;
}
</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <div>
    <h2 style="color:red;">Welcome to</h2>
    <div class="logo">ConzChat</div>
  </div>

  <div>
    <button onclick="show('login')">Login</button>
    <button onclick="show('signup')">Create Account</button>
  </div>

  <div>~ Developed by Conz ~</div>
</div>

<!-- LOGIN -->
<div id="login" class="screen" style="padding:20px;">
  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password">
  <button onclick="login()">Login</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen" style="padding:20px;">
  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password">
  <input id="su_name" placeholder="Display Name">
  <button onclick="signup()">Create</button>
</div>

<!-- APP -->
<div id="app" class="screen">
  <div class="header">
    <span onclick="goBack()">⬅</span>
    <span id="title">Chats</span>
    <span onclick="openProfile(currentUser)">👤</span>
  </div>
  <div id="content"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  projectId:"conzchat"
});

const db = firebase.firestore();
const auth = firebase.auth();

let currentUser="";
let stack=[];

/* NAV */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function push(fn){ stack.push(fn); }

function goBack(){
  if(stack.length<=1){ show("welcome"); return; }
  stack.pop();
  stack[stack.length-1]();
}

/* AUTH */
async function signup(){
  let username = su_user.value;
  let email = username+"@conz.app";

  let res = await auth.createUserWithEmailAndPassword(email, su_pass.value);

  await db.collection("users").doc(res.user.uid).set({
    username:username,
    name:su_name.value,
    created:Date.now(),
    photo:""
  });

  currentUser=res.user.uid;
  openChats();
}

async function login(){
  let email = li_user.value+"@conz.app";

  let res = await auth.signInWithEmailAndPassword(email, li_pass.value);

  currentUser=res.user.uid;
  openChats();
}

/* CHAT LIST */
function openChats(){
  show("app");
  push(openChats);
  title.innerText="Chats";

  db.collection("users").onSnapshot(snap=>{
    content.innerHTML="";

    snap.forEach(doc=>{
      let u=doc.data();

      if(doc.id!==currentUser){
        content.innerHTML+=`
        <div class="listItem" onclick="openChat('${doc.id}','${u.username}')">
          <div class="avatar"></div>
          <div>${u.username}</div>
        </div>`;
      }
    });
  });
}

/* CHAT */
function chatId(a,b){ return [a,b].sort().join("_"); }

function openChat(uid,name){
  push(()=>openChat(uid,name));
  title.innerHTML=`<span onclick="openProfile('${uid}')">${name}</span>`;

  let id=chatId(currentUser,uid);

  content.innerHTML=`
    <div id="messages"></div>
    <div class="inputBar">
      <input id="msg">
      <button onclick="send('${uid}')">Send</button>
    </div>
  `;

  db.collection("messages").doc(id).collection("msgs")
  .orderBy("time").onSnapshot(snap=>{
    messages.innerHTML="";

    snap.forEach(doc=>{
      let m=doc.data();
      let side=m.from===currentUser?"me":"other";

      messages.innerHTML+=`
        <div class="${side}">
          <div class="bubble">${m.text}</div>
        </div>`;
    });

    messages.scrollTop=messages.scrollHeight;
  });
}

async function send(uid){
  if(!msg.value) return;

  let id=chatId(currentUser,uid);

  await db.collection("messages").doc(id).collection("msgs").add({
    from:currentUser,
    text:msg.value,
    time:Date.now()
  });

  msg.value="";
}

/* PROFILE */
async function openProfile(uid){
  push(()=>openProfile(uid));
  title.innerText="Profile";

  let doc=await db.collection("users").doc(uid).get();
  let d=doc.data();

  let days=Math.floor((Date.now()-d.created)/86400000);

  content.innerHTML=`
  <div style="text-align:center;">
    <img class="profilePic" src="${d.photo}">
    ${uid===currentUser ? '<input type="file" onchange="upload(event)">' : ''}
    <h2>${d.name}</h2>
    <p>@${d.username}</p>
    <p>${days} days on ConzChat</p>
  </div>`;
}

function upload(e){
  let reader=new FileReader();
  reader.onload=async ()=>{
    await db.collection("users").doc(currentUser).update({
      photo:reader.result
    });
    openProfile(currentUser);
  };
  reader.readAsDataURL(e.target.files[0]);
}
</script>

</body>
</html>
