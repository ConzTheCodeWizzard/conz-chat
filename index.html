<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body { margin:0; font-family:Arial; background:black; color:white; }
.screen { display:none; height:100vh; flex-direction:column; }
.active { display:flex; }

/* HEADER */
.header {
  background:red;
  color:black;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* BUTTON */
button {
  background:red;
  border:none;
  color:white;
  padding:12px;
  margin:5px;
}

/* INPUT */
input {
  padding:12px;
  margin:5px;
  background:black;
  border:1px solid red;
  color:white;
}

/* LIST */
.item {
  padding:12px;
  border-bottom:1px solid #222;
}

/* CHAT */
#messages { flex:1; overflow:auto; padding:10px; }

.me { text-align:right; }
.me div { background:red; padding:10px; border-radius:10px; display:inline-block; }

.other { text-align:left; }
.other div { background:#222; padding:10px; border-radius:10px; display:inline-block; }

.inputBar { display:flex; padding:10px; }
.inputBar input { flex:1; }
</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active" style="justify-content:center;align-items:center;">
  <h1 style="color:red;">ConzChat</h1>
  <button onclick="nav('login')">Login</button>
  <button onclick="nav('signup')">Create Account</button>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <div class="header">
    <span onclick="nav('welcome')">⬅</span>
    Login
    <span></span>
  </div>

  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen">
  <div class="header">
    <span onclick="nav('welcome')">⬅</span>
    Create Account
    <span></span>
  </div>

  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password" placeholder="Password">
  <button onclick="signup()">Create</button>
</div>

<!-- CHAT LIST -->
<div id="home" class="screen">
  <div class="header">
    <span onclick="logout()">⬅</span>
    ConzChat
    <span onclick="nav('users')">＋</span>
  </div>

  <div id="chatList"></div>
</div>

<!-- USER LIST -->
<div id="users" class="screen">
  <div class="header">
    <span onclick="nav('home')">⬅</span>
    Find Users
    <span></span>
  </div>

  <div id="userList"></div>
</div>

<!-- CHAT -->
<div id="chat" class="screen">
  <div class="header">
    <span onclick="nav('home')">⬅</span>
    <span id="chatName"></span>
    <span></span>
  </div>

  <div id="messages"></div>

  <div class="inputBar">
    <input id="msg">
    <button onclick="send()">Send</button>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  projectId:"conzchat"
});

const db = firebase.firestore();
const auth = firebase.auth();

let currentUser = "";
let currentChat = "";

/* NAV */
function nav(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* AUTH */
async function signup(){
  let u = su_user.value;
  let p = su_pass.value;

  let res = await auth.createUserWithEmailAndPassword(u+"@app.com", p);

  await db.collection("users").doc(res.user.uid).set({ username:u });

  currentUser = res.user.uid;
  loadChats();
  nav("home");
}

async function login(){
  let u = li_user.value;
  let p = li_pass.value;

  let res = await auth.signInWithEmailAndPassword(u+"@app.com", p);

  currentUser = res.user.uid;
  loadChats();
  nav("home");
}

function logout(){
  auth.signOut();
  nav("welcome");
}

/* CHAT LIST */
function loadChats(){
  db.collection("messages").onSnapshot(snap=>{
    let chats = {};
    snap.forEach(doc=>{
      let id = doc.id.split("_");
      if(id.includes(currentUser)){
        let other = id[0]===currentUser ? id[1] : id[0];
        chats[other] = true;
      }
    });

    chatList.innerHTML="";

    Object.keys(chats).forEach(uid=>{
      db.collection("users").doc(uid).get().then(doc=>{
        chatList.innerHTML += `
          <div class="item" onclick="openChat('${uid}','${doc.data().username}')">
            ${doc.data().username}
          </div>
        `;
      });
    });
  });
}

/* USER LIST */
function loadUsers(){
  db.collection("users").get().then(snap=>{
    userList.innerHTML="";
    snap.forEach(doc=>{
      if(doc.id!==currentUser){
        userList.innerHTML += `
          <div class="item" onclick="openChat('${doc.id}','${doc.data().username}')">
            ${doc.data().username}
          </div>
        `;
      }
    });
  });
}

/* OPEN USER LIST */
document.getElementById("users").addEventListener("click", loadUsers);

/* CHAT */
function chatId(a,b){ return [a,b].sort().join("_"); }

function openChat(uid,name){
  currentChat = uid;
  chatName.innerText = name;
  nav("chat");

  let id = chatId(currentUser,uid);

  db.collection("messages").doc(id).collection("msgs")
  .orderBy("time")
  .onSnapshot(snap=>{
    messages.innerHTML="";
    snap.forEach(doc=>{
      let m = doc.data();
      let cls = m.from===currentUser ? "me":"other";

      messages.innerHTML += `
        <div class="${cls}">
          <div>${m.text}</div>
        </div>
      `;
    });

    messages.scrollTop = messages.scrollHeight;
  });
}

/* SEND */
async function send(){
  if(!msg.value) return;

  let id = chatId(currentUser,currentChat);

  await db.collection("messages").doc(id).collection("msgs").add({
    from:currentUser,
    text:msg.value,
    time:Date.now()
  });

  msg.value="";
}
</script>

</body>
</html>
