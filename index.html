<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body { margin:0; font-family:Arial; background:black; color:white; }

.screen { display:none; padding:15px; }
.active { display:block; }

button {
  width:100%;
  padding:12px;
  margin:8px 0;
  background:red;
  border:none;
  color:white;
}

input {
  width:100%;
  padding:10px;
  margin:5px 0;
  background:black;
  border:1px solid red;
  color:white;
}

/* HEADER */
.header {
  background:red;
  color:black;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

/* CHAT AREA */
#messages {
  height:300px;
  overflow-y:auto;
  border:1px solid red;
  padding:10px;
  margin:10px 0;
}

/* BUBBLES */
.chatBubbleMe {
  background:red;
  padding:8px;
  margin:5px;
  text-align:right;
  border-radius:10px;
  width:fit-content;
  margin-left:auto;
}

.chatBubbleOther {
  background:#222;
  padding:8px;
  margin:5px;
  text-align:left;
  border-radius:10px;
  width:fit-content;
}

/* USER SEARCH RESULTS */
.user {
  padding:10px;
  border-bottom:1px solid red;
}
</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <h1 style="color:red;text-align:center;">Welcome to ConzChat</h1>

  <button onclick="show('login')">Login</button>
  <button onclick="show('signup')">Create Account</button>

  <p style="font-size:12px;text-align:center;">~ Developed By Conz ~</p>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen">
  <h2>Create Account</h2>

  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password" placeholder="Password">
  <input id="su_dob" type="date">

  <button onclick="signup()">Create Account</button>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <h2>Login</h2>

  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password">

  <button onclick="login()">Login</button>
</div>

<!-- MAIN APP -->
<div id="app" class="screen">
  <div class="header" id="chatHeader">ConzChat</div>

  <input id="search" placeholder="Search username">
  <button onclick="findUser()">Find</button>

  <div id="results"></div>

  <div id="messages"></div>

  <input id="msg">
  <button onclick="send()">Send</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  authDomain:"conzchat.firebaseapp.com",
  projectId:"conzchat"
});

const db = getFirestore(app);

let currentUser="";
let currentChat="";

/* NAV */
window.show = id=>{
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
};

/* SIGNUP */
window.signup = async ()=>{
  let u=su_user.value;
  let p=su_pass.value;
  let dob=new Date(su_dob.value);

  let age=new Date().getFullYear()-dob.getFullYear();
  if(age<13){ alert("Too young"); return; }

  let q=query(collection(db,"users"),where("username","==",u));
  let snap=await getDocs(q);

  if(!snap.empty){ alert("Username taken"); return; }

  await addDoc(collection(db,"users"),{
    username:u,
    password:p,
    created:Date.now()
  });

  currentUser=u;
  show("app");
};

/* LOGIN */
window.login = async ()=>{
  let u=li_user.value;
  let p=li_pass.value;

  let q=query(collection(db,"users"),
    where("username","==",u),
    where("password","==",p)
  );

  let snap=await getDocs(q);

  if(snap.empty){ alert("Incorrect"); return; }

  currentUser=u;
  show("app");
};

/* FIND USER */
window.findUser = async ()=>{
  let q=query(collection(db,"users"),where("username","==",search.value));
  let snap=await getDocs(q);

  results.innerHTML="";
  snap.forEach(doc=>{
    let u=doc.data();
    results.innerHTML+=`
  <div class="user" onclick="openChat('${u.username}')">
    ${u.username}
  </div>
`;
  });
};

/* OPEN CHAT */
window.openChat = user=>{
  currentChat = user;
  document.getElementById("chatHeader").innerText = user;
  loadMessages();
};

/* SEND */
window.send = async ()=>{
  if(!msg.value) return;

  await addDoc(collection(db,"messages"),{
    from:currentUser,
    to:currentChat,
    text:msg.value,
    time:Date.now()
  });

  msg.value="";
};

/* LOAD */
function loadMessages(){
  let q=query(collection(db,"messages"),orderBy("time"));

  onSnapshot(q,snap=>{
    messages.innerHTML="";

    snap.forEach(doc=>{
      let m=doc.data();

      if(
        (m.from===currentUser && m.to===currentChat) ||
        (m.from===currentChat && m.to===currentUser)
      ){
        let cls = m.from===currentUser ? "chatBubbleMe" : "chatBubbleOther";
        messages.innerHTML+=`<div class="${cls}">${m.text}</div>`;
      }
    });
  });
}
<!-- CHAT LIST SCREEN (PASTE THIS HERE) -->
<div id="chatList" class="screen">
  <div class="header">ConzChat</div>
  <div id="chatUsers"></div>
  <button onclick="show('profile')">My Profile</button>
</div>
</script>

</body>
</html>
