<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
}

/* GENERAL */
.screen { display:none; padding:20px; }
.active { display:block; }

button {
  width:100%;
  padding:12px;
  margin:10px 0;
  background:red;
  border:none;
  color:white;
}

input {
  width:100%;
  padding:10px;
  margin:5px 0;
  background:black;
  border:1px solid red;
  color:white;
}

.center {
  text-align:center;
}

/* HEADER */
.header {
  background:red;
  color:black;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

/* CHAT */
.chatBubbleMe {
  background:red;
  padding:8px;
  margin:5px;
  text-align:right;
}

.chatBubbleOther {
  background:red;
  padding:8px;
  margin:5px;
  text-align:left;
}
</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active center">
  <h1 style="color:red;">Welcome to ConzChat</h1>

  <button onclick="show('login')">Log into ConzChat</button>
  <button onclick="show('signup')">Create an account</button>

  <p style="font-size:12px;">~ Developed By Conz ~</p>
</div>

<!-- SIGN UP -->
<div id="signup" class="screen">
  <h2>Create Account</h2>

  <input id="su_username" placeholder="Username">
  <input id="su_password" type="password" placeholder="Password">
  <input id="su_dob" type="date">

  <button onclick="signup()">Create Account</button>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <h2>Login</h2>

  <input id="li_username" placeholder="Username">
  <input id="li_password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
</div>

<!-- MAIN -->
<div id="main" class="screen">
  <div class="header">ConzChat</div>

  <input id="searchUser" placeholder="Search username">
  <button onclick="findUser()">Find User</button>

  <div id="results"></div>
</div>

<!-- CHAT -->
<div id="chat" class="screen">
  <div class="header" id="chatHeader"></div>

  <div id="messages"></div>

  <input id="msgBox">
  <button onclick="sendMessage()">Send</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  authDomain: "conzchat.firebaseapp.com",
  projectId: "conzchat"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = "";
let currentChat = "";

/* NAV */
window.show = function(id) {
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
};

/* SIGNUP */
window.signup = async function() {
  let u = su_username.value;
  let p = su_password.value;
  let dob = new Date(su_dob.value);

  let age = new Date().getFullYear() - dob.getFullYear();
  if(age < 13){
    alert("You are not old enough");
    return;
  }

  let q = query(collection(db,"users"), where("username","==",u));
  let snap = await getDocs(q);

  if(!snap.empty){
    alert("username taken");
    return;
  }

  await addDoc(collection(db,"users"), {
    username:u,
    password:p,
    created:Date.now()
  });

  currentUser = u;
  show("main");
};

/* LOGIN */
window.login = async function(){
  let u = li_username.value;
  let p = li_password.value;

  let q = query(collection(db,"users"),
    where("username","==",u),
    where("password","==",p)
  );

  let snap = await getDocs(q);

  if(snap.empty){
    alert("login incorrect");
    return;
  }

  currentUser = u;
  show("main");
};

/* FIND USER */
window.findUser = async function(){
  let name = searchUser.value;

  let q = query(collection(db,"users"), where("username","==",name));
  let snap = await getDocs(q);

  results.innerHTML="";

  snap.forEach(doc=>{
    let d = doc.data();
    results.innerHTML += `<div onclick="openChat('${d.username}')">${d.username}</div>`;
  });
};

/* OPEN CHAT */
window.openChat = function(user){
  currentChat = user;
  chatHeader.innerText = user;
  show("chat");

  loadMessages();
};

/* SEND */
window.sendMessage = async function(){
  let text = msgBox.value;

  await addDoc(collection(db,"messages"),{
    from:currentUser,
    to:currentChat,
    text:text,
    time:Date.now()
  });

  msgBox.value="";
};

/* LOAD */
function loadMessages(){
  let q = query(collection(db,"messages"), orderBy("time"));

  onSnapshot(q,(snap)=>{
    messages.innerHTML="";

    snap.forEach(doc=>{
      let m = doc.data();

      if(
        (m.from===currentUser && m.to===currentChat) ||
        (m.from===currentChat && m.to===currentUser)
      ){
        let cls = m.from===currentUser ? "chatBubbleMe":"chatBubbleOther";
        messages.innerHTML += `<div class="${cls}">${m.text}</div>`;
      }
    });
  });
}
</script>

</body>
</html>
