<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <h2>Welcome to</h2>
  <h1 class="title">ConzChat</h1>

  <button onclick="show('login')">Login</button>
  <button onclick="show('signup')">Create Account</button>

  <p>~ Developed by Conz ~</p>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <h2>Login</h2>
  <input id="loginEmail" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="show('welcome')">Back</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen">
  <h2>Create Account</h2>

  <input id="signupUsername" placeholder="Username">
  <input id="signupEmail" placeholder="Email">
  <input id="signupPassword" type="password" placeholder="Password">

  <button onclick="signup()">Create</button>
  <button onclick="show('welcome')">Back</button>
</div>

<!-- HOME (CHAT LIST) -->
<div id="home" class="screen">
  <div class="topbar">
    <span onclick="logout()">Logout</span>
    <span>ConzChat</span>
    <span onclick="openProfile()">👤</span>
  </div>

  <div id="chatList"></div>

  <button onclick="show('search')">Find Users</button>
</div>

<!-- SEARCH -->
<div id="search" class="screen">
  <div class="topbar">
    <span onclick="show('home')">←</span>
    <span>Find Users</span>
  </div>

  <input id="searchInput" placeholder="Search...">
  <button onclick="searchUsers()">Search</button>

  <div id="results"></div>
</div>

<!-- CHAT -->
<div id="chat" class="screen">
  <div class="topbar">
    <span onclick="show('home')">←</span>
    <span id="chatName"></span>
  </div>

  <div id="messages"></div>

  <input id="msgInput" placeholder="Message...">
  <button onclick="sendMessage()">Send</button>
</div>

<!-- PROFILE -->
<div id="profile" class="screen">
  <div class="topbar">
    <span onclick="show('home')">←</span>
    <span>Profile</span>
  </div>

  <h2 id="profileName"></h2>
  <p id="daysOnApp"></p>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
</html>
