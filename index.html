<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active welcomeScreen">

  <canvas id="particles"></canvas>

  <div class="welcomeContent">
    <h2 class="welcomeText">Welcome to</h2>
    <h1 class="logo">ConzChat</h1>

    <div class="version">Version 1.0</div>

    <div id="rotatingText" class="rotatingText"></div>

    <button onclick="show('login')">Login</button>
    <button onclick="show('signup')">Create Account</button>
  </div>

</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <input id="loginEmail" placeholder="Email">
  <input id="loginPassword" type="password">
  <button onclick="login()">Login</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen">
  <input id="signupUsername" placeholder="Username">
  <input id="signupEmail" placeholder="Email">
  <input id="signupPassword" type="password">
  <button onclick="signup()">Create</button>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <div class="topbar">
    <button onclick="logout()">Logout</button>
    <span>ConzChat</span>
    <span id="profileBtn" onclick="openProfile()">👤</span>
  </div>

  <div id="chatList"></div>

  <div id="fab" onclick="toggleFab()">+</div>

  <div id="fabMenu">
    <div onclick="openSearch()">Find Friends</div>
    <div onclick="openSettings()">Colour Editor</div>
    <div onclick="show('updates')">Update Log</div>
  </div>
</div>

<!-- PROFILE -->
<div id="profile" class="screen">
  <div class="topbar">
    <button onclick="show('home')">Back</button>
    <span>Profile</span>
  </div>

  <div id="profileContent"></div>

  <input id="editName" placeholder="Edit display name">
  <button onclick="saveDisplayName()">Save Name</button>

  <p id="daysOnApp"></p>
</div>

<!-- FIND FRIENDS -->
<div id="search" class="screen">
  <div class="topbar">
    <button onclick="show('home')">Back</button>
    <span>Find Friends</span>
  </div>

  <input id="searchInput" placeholder="Search..." oninput="searchUsers()">
  <div id="results"></div>
</div>

<!-- COLOUR EDITOR -->
<div id="settings" class="screen">
  <div class="topbar">
    <button onclick="show('home')">Back</button>
    <span>Colour Editor</span>
  </div>

  <input type="color" id="mainColorPicker">
  <input type="color" id="secondaryColorPicker">
  <button onclick="saveTheme()">Save</button>
  <button onclick="resetTheme()">Reset</button>
</div>

<!-- CHAT -->
<div id="chat" class="screen">
  <div class="topbar">
    <button onclick="show('home')">Back</button>
    <span id="chatName" onclick="openProfile(currentChatUser)"></span>
  </div>

  <div id="messages"></div>

  <input id="msgInput">
  <button onclick="sendMessage()">Send</button>
</div>

<!-- UPDATE LOG -->
<div id="updates" class="screen">
  <div class="topbar">
    <button onclick="show('home')">Back</button>
    <span>Update Log</span>
  </div>

  <div style="text-align:left">
    <p>🔥 New animated welcome screen</p>
    <p>🌈 Multi neon particles added</p>
    <p>💬 Rotating intro text</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
</html>
