<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body {
  margin:0;
  background:black;
  color:red;
  font-family:Arial;
}

header {
  background:red;
  color:black;
  padding:15px;
  text-align:center;
  font-weight:bold;
}

.view { display:none; padding:10px; }
.active { display:block; }

input {
  width:100%;
  padding:10px;
  margin:8px 0;
  background:black;
  border:1px solid red;
  color:red;
}

button {
  width:100%;
  padding:10px;
  background:red;
  color:black;
  border:none;
  margin-top:5px;
}

.user {
  border:1px solid red;
  padding:10px;
  margin-top:5px;
}

#messages div {
  margin:5px 0;
}
</style>
</head>

<body>

<header>ConzChat</header>

<!-- LOGIN -->
<div id="login" class="view active">
  <h3>Create Username</h3>
  <input id="username" placeholder="Username">
  <button onclick="createUser()">Create</button>
</div>

<!-- MAIN -->
<div id="main" class="view">
  <h3>Find User</h3>
  <input id="search" placeholder="Search username">
  <button onclick="searchUser()">Search</button>
  <div id="results"></div>
</div>

<!-- CHAT -->
<div id="chat" class="view"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { 
  getFirestore, collection, addDoc, query, where, getDocs, 
  onSnapshot, orderBy 
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  authDomain: "conzchat.firebaseapp.com",
  projectId: "conzchat",
  storageBucket: "conzchat.firebasestorage.app",
  messagingSenderId: "431124465784",
  appId: "1:431124465784:web:055dbf6a8767b2f898458d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = "";
let currentChat = "";

// LOGIN
signInAnonymously(auth);

// CREATE USER
window.createUser = async function() {
  let username = document.getElementById("username").value;

  let q = query(collection(db, "users"), where("username", "==", username));
  let snap = await getDocs(q);

  if (!snap.empty) {
    alert("username already in use");
    return;
  }

  await addDoc(collection(db, "users"), {
    username: username,
    uid: auth.currentUser.uid
  });

  currentUser = username;

  document.getElementById("login").classList.remove("active");
  document.getElementById("main").classList.add("active");
};

// SEARCH USER
window.searchUser = async function() {
  let name = document.getElementById("search").value;

  let q = query(collection(db, "users"), where("username", "==", name));
  let snap = await getDocs(q);

  let results = document.getElementById("results");
  results.innerHTML = "";

  snap.forEach(doc => {
    let u = doc.data();
    results.innerHTML += `
      <div class="user" onclick="openChat('${u.username}')">
        ${u.username}
      </div>
    `;
  });
};

// OPEN CHAT
window.openChat = function(username) {
  currentChat = username;

  document.getElementById("main").classList.remove("active");

  document.getElementById("chat").innerHTML = `
    <h3>Chat with ${username}</h3>
    <div id="messages"></div>
    <input id="msgInput" placeholder="Type message">
    <button onclick="sendMessage()">Send</button>
    <button onclick="goBack()">Back</button>
  `;

  document.getElementById("chat").classList.add("active");

  loadMessages();
};

// SEND MESSAGE
window.sendMessage = async function() {
  let text = document.getElementById("msgInput").value;

  if (!text) return;

  await addDoc(collection(db, "messages"), {
    from: currentUser,
    to: currentChat,
    text: text,
    time: Date.now()
  });

  document.getElementById("msgInput").value = "";
};

// LOAD MESSAGES (REAL TIME)
function loadMessages() {
  const q = query(collection(db, "messages"), orderBy("time"));

  onSnapshot(q, (snapshot) => {
    let messagesDiv = document.getElementById("messages");
    messagesDiv.innerHTML = "";

    snapshot.forEach(doc => {
      let m = doc.data();

      if (
        (m.from === currentUser && m.to === currentChat) ||
        (m.from === currentChat && m.to === currentUser)
      ) {
        messagesDiv.innerHTML += `
          <div>${m.from}: ${m.text}</div>
        `;
      }
    });
  });
}

// BACK BUTTON
window.goBack = function() {
  document.getElementById("chat").classList.remove("active");
  document.getElementById("main").classList.add("active");
};
</script>

</body>
</html>
