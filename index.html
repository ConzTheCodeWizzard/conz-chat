<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body { margin:0; font-family:Arial; background:black; color:white; }

/* SCREENS */
.screen { display:none; height:100vh; flex-direction:column; }
.active { display:flex; }

/* HEADER */
.header {
  background:red;
  color:black;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-weight:bold;
}

/* BUTTON */
button {
  padding:12px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
  width:100%;
  margin-top:10px;
}

/* INPUT */
input {
  padding:12px;
  margin:6px 0;
  background:black;
  border:1px solid red;
  color:white;
  border-radius:6px;
  width:100%;
}

/* CHAT LIST */
.chatItem {
  padding:12px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar {
  width:40px;
  height:40px;
  border-radius:50%;
  background:#333;
}

.online {
  width:10px;
  height:10px;
  background:lime;
  border-radius:50%;
  position:absolute;
  margin-left:28px;
  margin-top:28px;
}

.preview { font-size:12px; color:gray; }

/* CHAT */
#messages { flex:1; overflow:auto; padding:10px; }

.bubble {
  padding:10px;
  border-radius:10px;
  margin:5px;
  display:inline-block;
  max-width:70%;
}

.me { text-align:right; }
.me .bubble { background:red; }

.other { text-align:left; }
.other .bubble { background:#222; }

.status { font-size:10px; opacity:0.7; }

.typing { font-size:12px; color:gray; padding:5px; }

</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active" style="justify-content:center;align-items:center;text-align:center;padding:20px;">
  <h1 style="color:red;">ConzChat</h1>
  <button onclick="show('login')">Login</button>
  <button onclick="show('signup')">Create Account</button>
</div>

<!-- LOGIN -->
<div id="login" class="screen" style="padding:20px;">
  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen" style="padding:20px;">
  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password" placeholder="Password">
  <input id="su_name" placeholder="Display Name">
  <button onclick="signup()">Create</button>
</div>

<!-- APP -->
<div id="app" class="screen">

  <div class="header">
    <span onclick="goBack()">⬅</span>
    <span id="title">Chats</span>
    <span onclick="openAdd()">➕</span>
  </div>

  <div id="content"></div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  projectId:"conzchat"
});

const db = firebase.firestore();

let currentUser="";
let currentChat="";
let historyStack=[];

/* NAV */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function push(view){
  historyStack.push(view);
}

function goBack(){
  historyStack.pop();
  let last = historyStack[historyStack.length-1];
  if(last) last();
}

/* SIGNUP */
async function signup(){
  let u=su_user.value;

  let snap=await db.collection("users").where("username","==",u).get();
  if(!snap.empty){ alert("Username taken"); return; }

  await db.collection("users").doc(u).set({
    username:u,
    password:su_pass.value,
    name:su_name.value,
    created:Date.now(),
    online:true
  });

  currentUser=u;
  show("app");
  openChats();
}

/* LOGIN */
async function login(){
  let doc = await db.collection("users").doc(li_user.value).get();

  if(!doc.exists || doc.data().password !== li_pass.value){
    alert("Login failed");
    return;
  }

  currentUser=li_user.value;

  await db.collection("users").doc(currentUser).update({online:true});

  show("app");
  openChats();
}

/* CHAT LIST */
function openChats(){
  push(openChats);
  title.innerText="Chats";

  db.collection("messages").onSnapshot(snap=>{
    let chats={};

    snap.forEach(doc=>{
      let m=doc.data();
      if(m.from===currentUser) chats[m.to]=m;
      if(m.to===currentUser) chats[m.from]=m;
    });

    content.innerHTML="";

    Object.keys(chats).forEach(u=>{
      let m=chats[u];

      content.innerHTML+=`
      <div class="chatItem" onclick="openChat('${u}')">
        <div style="position:relative;">
          <div class="avatar"></div>
          <div class="online"></div>
        </div>
        <div>
          <div>${u}</div>
          <div class="preview">${m.text}</div>
        </div>
      </div>`;
    });
  });
}

/* OPEN CHAT */
function openChat(user){
  currentChat=user;
  push(()=>openChat(user));
  title.innerText=user;

  content.innerHTML=`
    <div id="messages"></div>
    <div id="typing" class="typing"></div>
    <div style="display:flex;">
      <input id="msg" style="flex:1;">
      <button onclick="send()">Send</button>
    </div>
  `;

  loadMessages();
}

/* SEND */
async function send(){
  if(!msg.value) return;

  await db.collection("messages").add({
    from:currentUser,
    to:currentChat,
    text:msg.value,
    time:Date.now(),
    status:"S"
  });

  msg.value="";
}

/* LOAD MESSAGES */
function loadMessages(){
  db.collection("messages").orderBy("time")
  .onSnapshot(snap=>{
    messages.innerHTML="";

    snap.forEach(doc=>{
      let m=doc.data();

      if(
        (m.from===currentUser && m.to===currentChat) ||
        (m.from===currentChat && m.to===currentUser)
      ){
        if(m.to===currentUser && m.status!=="R"){
          doc.ref.update({status:"R"});
        }

        let side = m.from===currentUser ? "me" : "other";

        messages.innerHTML+=`
          <div class="${side}">
            <div class="bubble">${m.text}</div>
            <div class="status">${m.status}</div>
          </div>
        `;
      }
    });

    messages.scrollTop=messages.scrollHeight;
  });
}

/* ADD USER */
function openAdd(){
  push(openAdd);
  title.innerText="Add Friend";

  content.innerHTML=`
    <input id="searchUser" placeholder="Username">
    <button onclick="findUser()">Search</button>
    <div id="results"></div>
  `;
}

async function findUser(){
  let doc = await db.collection("users").doc(searchUser.value).get();

  if(!doc.exists){
    results.innerHTML="User not found";
    return;
  }

  results.innerHTML=`
    <div class="chatItem" onclick="openChat('${searchUser.value}')">
      ${searchUser.value}
    </div>
  `;
}
</script>

</body>
</html>
