<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body { margin:0; font-family:Arial; background:black; color:white; }

.screen { display:none; }
.active { display:block; }

.center { text-align:center; padding:40px; }

button {
  width:90%;
  padding:12px;
  margin:10px auto;
  display:block;
  background:red;
  border:none;
  color:white;
}

input {
  width:90%;
  padding:10px;
  margin:5px auto;
  display:block;
  background:black;
  border:1px solid red;
  color:white;
}

.header {
  display:flex;
  align-items:center;
  justify-content:center;
  background:red;
  color:black;
  padding:12px;
  font-weight:bold;
}

.header img {
  width:30px;
  height:30px;
  border-radius:50%;
  margin-right:10px;
}

.chatListItem {
  padding:12px;
  border-bottom:1px solid red;
}

.chatBubbleMe {
  background:red;
  padding:8px;
  margin:5px;
  margin-left:auto;
  width:fit-content;
  border-radius:10px;
}

.chatBubbleOther {
  background:#222;
  padding:8px;
  margin:5px;
  width:fit-content;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active center">
<h1 style="color:red;">Welcome to ConzChat</h1>
<button onclick="show('login')">Login</button>
<button onclick="show('signup')">Create Account</button>
<p style="font-size:12px;">~ Developed By Conz ~</p>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen center">
<h2>Create Account</h2>
<input id="su_user" placeholder="Username">
<input id="su_pass" type="password" placeholder="Password">
<input id="su_dob" type="date">
<button onclick="signup()">Create</button>
</div>

<!-- LOGIN -->
<div id="login" class="screen center">
<h2>Login</h2>
<input id="li_user" placeholder="Username">
<input id="li_pass" type="password">
<button onclick="login()">Login</button>
</div>

<!-- CHAT LIST -->
<div id="chatList" class="screen">
<div class="header">
<img id="myPic" src="">
ConzChat
</div>

<div id="chatUsers"></div>

<button onclick="show('find')">＋ Find Friend</button>
<button onclick="show('profile')">Profile</button>
</div>

<!-- FIND USER -->
<div id="find" class="screen center">
<h3>Find User</h3>
<input id="searchUser">
<button onclick="findUser()">Search</button>
<div id="results"></div>
</div>

<!-- CHAT -->
<div id="chat" class="screen">
<div class="header" id="chatHeader">Chat</div>

<div id="messages" style="height:300px;overflow:auto;"></div>

<input id="msg">
<button onclick="send()">Send</button>
</div>

<!-- PROFILE -->
<div id="profile" class="screen center">
<img id="profilePic" style="width:80px;height:80px;border-radius:50%;">
<input id="displayName" placeholder="Change name">
<p id="usernameText"></p>
<p id="days"></p>
<button onclick="saveProfile()">Save</button>
<button onclick="show('chatList')">Back</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, where, onSnapshot, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  authDomain:"conzchat.firebaseapp.com",
  projectId:"conzchat"
});

const db = getFirestore(app);

let currentUser="";
let currentChat="";

/* NAV */
window.show=id=>{
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
};

/* SIGNUP */
window.signup=async()=>{
  let u=su_user.value;
  let p=su_pass.value;
  let dob=new Date(su_dob.value);

  let age=new Date().getFullYear()-dob.getFullYear();
  if(age<13){ alert("You are not old enough"); return; }

  let q=query(collection(db,"users"),where("username","==",u));
  let snap=await getDocs(q);
  if(!snap.empty){ alert("Username taken"); return; }

  await setDoc(doc(db,"users",u),{
    username:u,
    password:p,
    created:Date.now(),
    name:u
  });

  currentUser=u;
  loadProfile();
  show("chatList");
};

/* LOGIN */
window.login=async()=>{
  let u=li_user.value;
  let p=li_pass.value;

  let ref=doc(db,"users",u);
  let snap=await getDocs(query(collection(db,"users"),where("username","==",u),where("password","==",p)));

  if(snap.empty){ alert("Incorrect login"); return; }

  currentUser=u;
  loadProfile();
  show("chatList");
};

/* PROFILE LOAD */
async function loadProfile(){
  let q=query(collection(db,"users"),where("username","==",currentUser));
  let snap=await getDocs(q);
  let d=snap.docs[0].data();

  profilePic.src="https://i.pravatar.cc/100";
  usernameText.innerText="@"+d.username;
  displayName.value=d.name;

  let daysOld=Math.floor((Date.now()-d.created)/86400000);
  days.innerText="Days on ConzChat: "+daysOld;
}

/* SAVE PROFILE */
window.saveProfile=async()=>{
  await updateDoc(doc(db,"users",currentUser),{
    name:displayName.value
  });
  alert("Saved");
};

/* FIND USER */
window.findUser=async()=>{
  let q=query(collection(db,"users"),where("username","==",searchUser.value));
  let snap=await getDocs(q);

  results.innerHTML="";
  if(snap.empty){ results.innerText="User doesn't exist"; return; }

  snap.forEach(doc=>{
    let u=doc.data();
    results.innerHTML+=`
      <div class="chatListItem" onclick="openChat('${u.username}')">
        ${u.username}
      </div>
    `;
  });
};

/* OPEN CHAT */
window.openChat=user=>{
  currentChat=user;
  chatHeader.innerText=user;
  show("chat");
  loadMessages();
};

/* SEND */
window.send=async()=>{
  if(!msg.value) return;

  await addDoc(collection(db,"messages"),{
    from:currentUser,
    to:currentChat,
    text:msg.value,
    time:Date.now(),
    status:"S"
  });

  msg.value="";
};

/* LOAD MESSAGES */
function loadMessages(){
  onSnapshot(collection(db,"messages"),snap=>{
    messages.innerHTML="";

    snap.forEach(doc=>{
      let m=doc.data();

      if(
        (m.from===currentUser && m.to===currentChat) ||
        (m.from===currentChat && m.to===currentUser)
      ){
        let cls=m.from===currentUser?"chatBubbleMe":"chatBubbleOther";
        messages.innerHTML+=`<div class="${cls}">${m.text} (${m.status})</div>`;
      }
    });
  });
}
</script>

</body>
</html>
