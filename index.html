<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body { margin:0; font-family:Arial; background:black; color:white; }
.screen { display:none; height:100vh; }
.active { display:flex; flex-direction:column; justify-content:center; align-items:center; }

h1 { color:red; }

button {
  width:80%;
  padding:12px;
  margin:10px;
  background:red;
  border:none;
  color:white;
}

input {
  width:80%;
  padding:10px;
  margin:5px;
  background:black;
  border:1px solid red;
  color:white;
}
</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <h1>ConzChat</h1>
  <button onclick="show('login')">Login</button>
  <button onclick="show('signup')">Create Account</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen">
  <h2>Create Account</h2>
  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password" placeholder="Password">
  <input id="su_dob" type="date">
  <button onclick="signup()">Create</button>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <h2>Login</h2>
  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password">
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" class="screen">
  <h2>Logged in</h2>
  <p id="who"></p>
</div>

<!-- Firebase (compat = stable) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  authDomain: "conzchat.firebaseapp.com",
  projectId: "conzchat"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* NAV */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* SIGNUP */
async function signup(){
  let username = su_user.value.trim();
  let password = su_pass.value;
  let dob = new Date(su_dob.value);

  if(!username || !password){ alert("Fill all fields"); return; }

  let age = new Date().getFullYear() - dob.getFullYear();
  if(age < 13){ alert("Too young"); return; }

  // 🔒 check username unique
  let snap = await db.collection("users")
    .where("username","==",username).get();

  if(!snap.empty){
    alert("Username already taken");
    return;
  }

  try{
    // hidden email trick
    let fakeEmail = username + "@conzchat.com";

    let userCred = await auth.createUserWithEmailAndPassword(fakeEmail, password);

    await db.collection("users").doc(userCred.user.uid).set({
      username: username,
      created: Date.now()
    });

    who.innerText = "Welcome " + username;
    show("app");

  }catch(e){
    alert(e.message);
  }
}

/* LOGIN */
async function login(){
  let username = li_user.value.trim();
  let password = li_pass.value;

  let fakeEmail = username + "@conzchat.com";

  try{
    let userCred = await auth.signInWithEmailAndPassword(fakeEmail, password);

    let doc = await db.collection("users").doc(userCred.user.uid).get();
    let data = doc.data();

    who.innerText = "Welcome " + data.username;
    show("app");

  }catch(e){
    if(e.code === "auth/user-not-found"){
      alert("Username doesn't exist");
    } else if(e.code === "auth/wrong-password"){
      alert("Wrong password");
    } else {
      alert(e.message);
    }
  }
}
</script>

</body>
</html>
