<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="welcome" class="screen active welcomeScreen">
  <canvas id="particles"></canvas>

  <div class="welcomeContent">
    <h2>Welcome to</h2>
    <h1 class="logo">ConzChat</h1>

    <div id="rotatingText"></div>
    <div class="version">Version 1.0</div>

    <button onclick="show('login')">Login</button>
    <button onclick="show('signup')">Create Account</button>
  </div>

  <div class="footerText">Developed By Conz</div>
</div>

<div id="login" class="screen">
  <input id="loginEmail" placeholder="Email">
  <input id="loginPassword" type="password">
  <button onclick="login()">Login</button>
</div>

<div id="signup" class="screen">
  <input id="signupUsername" placeholder="Username">
  <input id="signupEmail" placeholder="Email">
  <input id="signupPassword" type="password">
  <button onclick="signup()">Create</button>
</div>

<div id="home" class="screen">
  <div class="topbar center">
    <button class="plainBtn" onclick="logout()">Logout</button>
    <span>ConzChat</span>
    <span id="profileBtn" onclick="openProfile()">👤</span>
  </div>

  <div id="chatList"></div>

  <div id="fab" onclick="toggleFab()">+</div>

  <div id="fabMenu">
    <div onclick="openSearch()">Find Friends</div>
    <div onclick="openSettings()">Colour Editor</div>
    <div id="devBtn" onclick="devOpen()">Dev Panel</div>
  </div>
</div>

<div id="profile" class="screen">
  <div class="topbar center">
    <button class="plainBtn" onclick="show('home')">Back</button>
    <span>Profile</span>
  </div>

  <div id="profileContent"></div>
</div>

<div id="search" class="screen">
  <div class="topbar center">
    <button class="plainBtn" onclick="show('home')">Back</button>
    <span>Find Friends</span>
  </div>

  <input id="searchInput" placeholder="Search..." oninput="searchUsers()">
  <div id="results"></div>
</div>

<div id="settings" class="screen">
  <div class="topbar center">
    <button class="plainBtn" onclick="show('home')">Back</button>
    <span>Colour Editor</span>
  </div>

  <button onclick="pickMain()">Edit Primary Colour</button>
  <button onclick="pickSecondary()">Edit Secondary Colour</button>

  <button onclick="saveTheme()">Save</button>
  <button onclick="resetTheme()">Reset</button>
</div>

<div id="chat" class="screen">
  <div class="topbar center">
    <button class="plainBtn" onclick="show('home')">Back</button>
    <span id="chatName"></span>
  </div>

  <div id="messages"></div>

  <input id="msgInput">
  <button onclick="sendMessage()">Send</button>
</div>

<input type="file" id="filePicker" accept="image/*" style="display:none">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>
<script src="particles.js"></script>
<script src="app.js"></script>
<script src="dev.js"></script>

</body>
</html>
