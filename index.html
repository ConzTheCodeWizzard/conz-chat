<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HOME / CHAT LIST -->
<div id="home" class="screen active">

  <div class="topbar">
    <div class="logo">ConzChat</div>
    <div onclick="openMyProfile()">👤</div>
  </div>

  <!-- CHAT LIST -->
  <div id="chatList"></div>

  <!-- FAB -->
  <div class="fab" onclick="toggleFab()">+</div>

  <div id="fabMenu">
    <div onclick="openSearch()">Find People</div>
  </div>

</div>

<!-- CHAT SCREEN -->
<div id="chat" class="screen">

  <div class="topbar">
    <div onclick="show('home')">←</div>
    <div id="chatName"></div>
  </div>

  <div id="messages" class="chatBox"></div>

  <div class="msgInput">
    <input id="msg" placeholder="Message...">
    <button onclick="send()">Send</button>
  </div>

</div>

<!-- SEARCH -->
<div id="search" class="screen">

  <div class="topbar">
    <div onclick="show('home')">←</div>
    <div>Find People</div>
  </div>

  <input id="searchInput" placeholder="Search username..." oninput="searchUsers()">
  <div id="results"></div>

</div>

<!-- PROFILE -->
<div id="profile" class="screen">

  <div class="topbar">
    <div onclick="show('home')">←</div>
    <div>Profile</div>
  </div>

  <div class="profileTop">
    <div id="profilePic">👤</div>
    <h2 id="profileName"></h2>
  </div>

</div>

<script src="firebase.js"></script>
<script src="app.js"></script>

<script>
function toggleFab(){
  fabMenu.classList.toggle("open");
}
</script>

</body>
</html>
