<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <h2>Welcome to</h2>
  <h1 class="logo">ConzChat</h1>

  <button onclick="show('login')">Login</button>
  <button onclick="show('signup')">Create Account</button>

  <p>~ Developed by Conz ~</p>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <div class="header">
    <span onclick="show('welcome')">⬅</span>
    Login
  </div>

  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password">
  <button onclick="login()">Login</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen">
  <div class="header">
    <span onclick="show('welcome')">⬅</span>
    Create Account
  </div>

  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password">
  <button onclick="signup()">Create</button>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <div class="header">
    <span onclick="openProfile()">👤</span>
    ConzChat
    <span onclick="openSearch()">＋</span>
  </div>

  <div id="chatList"></div>
</div>

<!-- SEARCH -->
<div id="search" class="screen">
  <div class="header">
    <span onclick="show('home')">⬅</span>
    Find Users
  </div>

  <input id="searchInput" placeholder="Search username">
  <button onclick="searchUsers()">Search</button>

  <div id="results"></div>
</div>

<!-- PROFILE -->
<div id="profile" class="screen">
  <div class="header">
    <span onclick="show('home')">⬅</span>
    Profile
  </div>

  <div id="profileContent"></div>
</div>

<!-- CHAT -->
<div id="chat" class="screen">
  <div class="header">
    <span onclick="show('home')">⬅</span>
    <span id="chatName"></span>
    <span onclick="openProfile(otherUser)">👤</span>
  </div>

  <div id="messages"></div>

  <div class="inputBar">
    <input id="msg">
    <button onclick="send()">Send</button>
  </div>
</div>

<!-- 🔥 FIREBASE (ALREADY IN RIGHT PLACE) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- YOUR FILES -->
<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
</html>
