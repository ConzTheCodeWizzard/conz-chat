<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    background: black;
    color: red;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .box {
    text-align: center;
    width: 90%;
    max-width: 320px;
  }

  h1 {
    background: red;
    color: black;
    padding: 10px;
    border-radius: 20px;
  }

  input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    background: black;
    border: 1px solid red;
    color: red;
  }

  button {
    width: 100%;
    padding: 10px;
    background: red;
    color: black;
    border: none;
    cursor: pointer;
  }

  /* popup */
  #popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
  }

  .popup-box {
    background: red;
    color: black;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="box">
  <h1>Conz Test</h1>

  <p>Username</p>
  <input id="username">

  <p>Password</p>
  <input id="password" type="password">

  <button onclick="login()">Log in</button>
</div>

<!-- popup -->
<div id="popup">
  <div class="popup-box">
    <p>Logged in successfully</p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script>
function login() {
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  let device = navigator.userAgent;
  let time = new Date().toLocaleString();
  let country = navigator.language;

  localStorage.setItem("user", user);
  localStorage.setItem("pass", pass);
  localStorage.setItem("device", device);
  localStorage.setItem("time", time);
  localStorage.setItem("country", country);

  document.getElementById("popup").style.display = "flex";
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
