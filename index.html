<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body {margin:0;font-family:Arial;background:black;color:white;}

.screen {display:none;height:100vh;}
.active {display:flex;flex-direction:column;}

.header {
  background:red;
  color:black;
  padding:15px;
  text-align:center;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button {
  background:red;
  border:none;
  color:white;
  padding:10px;
}

input {
  background:black;
  border:1px solid red;
  color:white;
  padding:10px;
  margin:5px;
}

.chatItem {
  padding:12px;
  border-bottom:1px solid red;
}

.preview {
  font-size:12px;
  color:gray;
}

#messages {
  flex:1;
  overflow:auto;
  padding:10px;
}

.me {text-align:right;}
.other {text-align:left;}

.bubble {
  display:inline-block;
  padding:8px;
  border-radius:10px;
  background:red;
  margin:5px;
}
</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active" style="justify-content:center;align-items:center;text-align:center;">
  <h1 style="color:red;">ConzChat</h1>
  <button onclick="show('login')">Login</button>
  <button onclick="show('signup')">Create Account</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen" style="justify-content:center;align-items:center;">
  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password" placeholder="Password">
  <button onclick="signup()">Create</button>
  <button onclick="show('welcome')">Back</button>
</div>

<!-- LOGIN -->
<div id="login" class="screen" style="justify-content:center;align-items:center;">
  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password">
  <button onclick="login()">Login</button>
  <button onclick="show('welcome')">Back</button>
</div>

<!-- APP -->
<div id="app" class="screen">

  <div class="header">
    <span onclick="showProfile()">👤</span>
    <span>ConzChat</span>
    <span onclick="showAdd()">➕</span>
  </div>

  <div id="chatList"></div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  projectId: "conzchat"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentUser = "";
let currentChat = "";

/* NAV */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* SIGNUP */
async function signup(){
  let u = su_user.value;
  let p = su_pass.value;

  if(!u || !p){ alert("Fill fields"); return; }

  let snap = await db.collection("users").where("username","==",u).get();
  if(!snap.empty){ alert("Username taken"); return; }

  await db.collection("users").add({
    username:u,
    password:p,
    created:Date.now()
  });

  currentUser = u;
  show("app");
  loadChats();
}

/* LOGIN */
async function login(){
  let snap = await db.collection("users")
    .where("username","==",li_user.value)
    .where("password","==",li_pass.value)
    .get();

  if(snap.empty){ alert("Login failed"); return; }

  currentUser = li_user.value;
  show("app");
  loadChats();
}

/* CHAT LIST */
function loadChats(){
  db.collection("messages").orderBy("time")
  .onSnapshot(snap=>{
    let chats = {};

    snap.forEach(doc=>{
      let m = doc.data();

      if(m.from===currentUser) chats[m.to] = m.text;
      if(m.to===currentUser) chats[m.from] = m.text;
    });

    chatList.innerHTML="";

    Object.keys(chats).forEach(u=>{
      chatList.innerHTML += `
        <div class="chatItem" onclick="openChat('${u}')">
          <div>${u}</div>
          <div class="preview">${chats[u]}</div>
        </div>
      `;
    });
  });
}

/* OPEN CHAT */
function openChat(user){
  currentChat = user;

  app.innerHTML = `
    <div class="header">
      <span onclick="location.reload()">⬅</span>
      <span>${user}</span>
      <span></span>
    </div>

    <div id="messages"></div>

    <div style="display:flex;">
      <input id="msg" style="flex:1;">
      <button onclick="send()">Send</button>
    </div>
  `;

  loadMessages();
}

/* SEND */
async function send(){
  if(!msg.value) return;

  await db.collection("messages").add({
    from:currentUser,
    to:currentChat,
    text:msg.value,
    time:Date.now(),
    status:"S"
  });

  msg.value="";
}

/* LOAD MESSAGES */
function loadMessages(){
  db.collection("messages").orderBy("time")
  .onSnapshot(snap=>{
    messages.innerHTML="";

    snap.forEach(doc=>{
      let m = doc.data();

      if(
        (m.from===currentUser && m.to===currentChat) ||
        (m.from===currentChat && m.to===currentUser)
      ){
        let side = m.from===currentUser ? "me" : "other";

        if(m.to===currentUser && m.status!=="R"){
          db.collection("messages").doc(doc.id).update({status:"R"});
        }

        messages.innerHTML += `
          <div class="${side}">
            <div class="bubble">${m.text} (${m.status})</div>
          </div>
        `;
      }
    });
  });
}

/* ADD FRIEND */
function showAdd(){
  app.innerHTML = `
    <div class="header">
      <span onclick="location.reload()">⬅</span>
      Add Friend
      <span></span>
    </div>

    <input id="searchUser" placeholder="Username">
    <button onclick="findUser()">Search</button>

    <div id="results"></div>
  `;
}

async function findUser(){
  let snap = await db.collection("users")
    .where("username","==",searchUser.value).get();

  results.innerHTML="";

  if(snap.empty){
    results.innerHTML="User not found";
    return;
  }

  snap.forEach(doc=>{
    let u = doc.data();

    results.innerHTML += `
      <div class="chatItem" onclick="openChat('${u.username}')">
        ${u.username}
      </div>
    `;
  });
}

/* PROFILE */
function showProfile(){
  app.innerHTML = `
    <div class="header">
      <span onclick="location.reload()">⬅</span>
      Profile
      <span></span>
    </div>

    <h2>${currentUser}</h2>
    <p>@${currentUser}</p>
  `;
}
</script>

</body>
</html>
