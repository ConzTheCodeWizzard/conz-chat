<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>
</head>

<body style="background:black; color:red; font-family:Arial;">

<h2>ConzChat</h2>

<input id="username" placeholder="Username">
<button onclick="test()">Test Firebase</button>

<p id="output"></p>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  authDomain: "conzchat.firebaseapp.com",
  projectId: "conzchat",
  storageBucket: "conzchat.firebasestorage.app",
  messagingSenderId: "431124465784",
  appId: "1:431124465784:web:055dbf6a8767b2f898458d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// login
signInAnonymously(auth).then(() => {
  document.getElementById("output").innerText = "Firebase connected ✅";
});

// test button
window.test = function() {
  document.getElementById("output").innerText = "Button works 👍";
}
</script>

</body>
</html>
