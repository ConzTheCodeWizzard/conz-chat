<!DOCTYPE html>
<html>
<head>
  <title>ConzChat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active">
  <h2>Welcome to</h2>
  <div class="logo">ConzChat</div>

  <button onclick="show('login')">Login</button>
  <button onclick="show('signup')">Create Account</button>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
  <div class="header">
    <span onclick="show('welcome')">←</span>
    <span>Login</span>
    <span></span>
  </div>

  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen">
  <div class="header">
    <span onclick="show('welcome')">←</span>
    <span>Create Account</span>
    <span></span>
  </div>

  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password" placeholder="Password">

  <button onclick="signup()">Create</button>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <div class="header">
    <span onclick="logout()">Logout</span>
    <span onclick="openMyProfile()">ConzChat</span>
    <span onclick="openSearch()">＋</span>
  </div>

  <div id="chatList"></div>
</div>

<!-- SEARCH -->
<div id="search" class="screen">
  <div class="header">
    <span onclick="goBack()">←</span>
    <span>Find Users</span>
    <span></span>
  </div>

  <input id="searchInput" placeholder="Search..." oninput="searchUsers()">
  <div id="results"></div>
</div>

<!-- CHAT -->
<div id="chat" class="screen">
  <div class="header">
    <span onclick="goBack()">←</span>
    <span id="chatName" onclick="openUserProfile(currentChat)">Chat</span>
    <span></span>
  </div>

  <div id="messages"></div>

  <div class="inputBar">
    <input id="msg" placeholder="Type message...">
    <button onclick="send()">Send</button>
  </div>
</div>

<!-- PROFILE -->
<div id="profile" class="screen">
  <div class="header">
    <span onclick="goBack()">←</span>
    <span>Settings</span>
    <span></span>
  </div>

  <div class="profileTop">

    <div id="profilePic" class="profilePic">👤</div>

    <input type="file" id="uploadPic">

    <h2 id="profileName"></h2>
    <p id="profileTag"></p>
    <p id="profileSince"></p>

    <textarea id="bioInput" placeholder="Describe yourself..."></textarea>

    <button onclick="saveProfile()">Save Profile</button>
  </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
</html>
