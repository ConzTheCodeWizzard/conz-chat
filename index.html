<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConzChat</title>

<style>
body { margin:0; font-family:Arial; background:black; color:white; }

/* SCREENS */
.screen { display:none; height:100vh; flex-direction:column; }
.active { display:flex; }

/* HEADER */
.header {
  background:red;
  color:black;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:bold;
}

/* CHAT LIST */
.chatItem {
  padding:12px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar {
  width:45px;
  height:45px;
  border-radius:50%;
  background:#333;
  object-fit:cover;
}

.dot {
  width:8px;
  height:8px;
  background:red;
  border-radius:50%;
}

/* CHAT */
#messages { flex:1; overflow:auto; padding:10px; }

.bubble {
  padding:10px;
  border-radius:10px;
  margin:5px;
  max-width:70%;
}

.me { text-align:right; }
.me .bubble { background:red; }

.other { text-align:left; }
.other .bubble { background:#222; }

.status { font-size:10px; opacity:0.6; }

.typing {
  font-size:12px;
  color:gray;
  padding:5px;
}

/* INPUT */
.inputBar {
  display:flex;
  gap:8px;
  padding:10px;
  border-top:1px solid #222;
}

.inputBar input {
  flex:1;
  padding:12px;
  border-radius:20px;
  border:1px solid red;
  background:black;
  color:white;
}

.inputBar button {
  padding:10px 15px;
  border-radius:20px;
  background:red;
  border:none;
  color:white;
}

/* PROFILE */
.profilePic {
  width:90px;
  height:90px;
  border-radius:50%;
  background:#333;
  margin:20px auto;
  object-fit:cover;
}
.center { text-align:center; }

button { margin:5px 0; padding:10px; background:red; color:white; border:none; border-radius:6px; }
input { width:100%; margin:5px 0; padding:10px; background:black; border:1px solid red; color:white; }

</style>
</head>

<body>

<!-- WELCOME -->
<div id="welcome" class="screen active" style="justify-content:center;align-items:center;">
  <h1 style="color:red;">ConzChat</h1>
  <button onclick="show('login')">Login</button>
  <button onclick="show('signup')">Create Account</button>
</div>

<!-- LOGIN -->
<div id="login" class="screen" style="padding:20px;">
  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password">
  <button onclick="login()">Login</button>
</div>

<!-- SIGNUP -->
<div id="signup" class="screen" style="padding:20px;">
  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password">
  <input id="su_name" placeholder="Display Name">
  <button onclick="signup()">Create</button>
</div>

<!-- APP -->
<div id="app" class="screen">
  <div class="header">
    <span onclick="goBack()">⬅</span>
    <span id="title">Chats</span>
    <span onclick="openProfile(currentUser)">👤</span>
  </div>
  <div id="content"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyB7JVaVsJCRX1uWzxr8oR3_bDF18mnj8to",
  projectId:"conzchat"
});

const db = firebase.firestore();

let currentUser="";
let currentChat="";
let historyStack=[];

/* NAV */
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function push(view){ historyStack.push(view); }
function goBack(){
  historyStack.pop();
  let last=historyStack[historyStack.length-1];
  if(last) last();
}

/* SIGNUP */
async function signup(){
  let u=su_user.value;

  let doc=await db.collection("users").doc(u).get();
  if(doc.exists){ alert("Username taken"); return; }

  await db.collection("users").doc(u).set({
    username:u,
    password:su_pass.value,
    name:su_name.value,
    created:Date.now(),
    photo:"",
    lastSeen:Date.now()
  });

  currentUser=u;
  show("app");
  openChats();
}

/* LOGIN */
async function login(){
  let doc=await db.collection("users").doc(li_user.value).get();

  if(!doc.exists || doc.data().password!==li_pass.value){
    alert("Login failed");
    return;
  }

  currentUser=li_user.value;
  show("app");
  openChats();
}

/* CHAT LIST */
function openChats(){
  push(openChats);
  title.innerText="Chats";

  db.collection("messages").onSnapshot(snap=>{
    let chats={};

    snap.forEach(doc=>{
      let m=doc.data();
      if(m.from===currentUser) chats[m.to]=m;
      if(m.to===currentUser) chats[m.from]=m;
    });

    let sorted = Object.entries(chats).sort((a,b)=>b[1].time-a[1].time);

    content.innerHTML="";

    sorted.forEach(([u,m])=>{
      content.innerHTML+=`
      <div class="chatItem" onclick="openChat('${u}')">
        <img class="avatar" src="">
        <div style="flex:1">
          <div>${u}</div>
          <div style="font-size:12px;color:gray">${m.text}</div>
        </div>
      </div>`;
    });
  });
}

/* CHAT */
function openChat(user){
  currentChat=user;
  push(()=>openChat(user));
  title.innerText=user;

  content.innerHTML=`
    <div id="messages"></div>
    <div id="typing" class="typing"></div>
    <div class="inputBar">
      <input id="msg" oninput="typingNow()">
      <button onclick="send()">Send</button>
    </div>
  `;

  loadMessages();
}

/* TYPING */
function typingNow(){
  db.collection("typing").doc(currentChat+currentUser).set({
    from:currentUser,
    to:currentChat,
    typing:true
  });
}

/* SEND */
async function send(){
  if(!msg.value) return;

  await db.collection("messages").add({
    from:currentUser,
    to:currentChat,
    text:msg.value,
    time:Date.now(),
    status:"S"
  });

  msg.value="";
}

/* LOAD */
function loadMessages(){
  db.collection("messages").orderBy("time")
  .onSnapshot(snap=>{
    messages.innerHTML="";

    snap.forEach(doc=>{
      let m=doc.data();

      if(
        (m.from===currentUser && m.to===currentChat) ||
        (m.from===currentChat && m.to===currentUser)
      ){
        if(m.to===currentUser && m.status!=="R"){
          doc.ref.update({status:"R"});
        }

        let side=m.from===currentUser?"me":"other";

        messages.innerHTML+=`
        <div class="${side}">
          <div class="bubble">${m.text}</div>
          <div class="status">${m.status}</div>
        </div>`;
      }
    });

    messages.scrollTop=messages.scrollHeight;
  });

  /* typing listener */
  db.collection("typing").onSnapshot(snap=>{
    snap.forEach(doc=>{
      let t=doc.data();
      if(t.from===currentChat && t.to===currentUser){
        typing.innerText="typing...";
      }
    });
  });
}

/* PROFILE */
async function openProfile(user){
  push(()=>openProfile(user));
  title.innerText="Profile";

  let doc=await db.collection("users").doc(user).get();
  let d=doc.data();

  let days=Math.floor((Date.now()-d.created)/86400000);

  content.innerHTML=`
  <div class="center">
    <img id="pfp" class="profilePic" src="${d.photo}">
    <input type="file" onchange="uploadPic(event)">
    <h2>${d.name}</h2>
    <p>@${d.username}</p>
    <p>${days} days on ConzChat</p>
  </div>`;
}

/* UPLOAD PIC */
function uploadPic(e){
  let file=e.target.files[0];
  let reader=new FileReader();

  reader.onload=async ()=>{
    await db.collection("users").doc(currentUser).update({
      photo:reader.result
    });
    openProfile(currentUser);
  };

  reader.readAsDataURL(file);
}
</script>

</body>
</html>
