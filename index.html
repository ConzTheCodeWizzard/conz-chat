<!DOCTYPE html>
<html>
<head>
  <title>ConzChat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔥 WELCOME -->
<div id="welcome" class="screen active">
  <h2>Welcome to</h2>
  <div class="logo">ConzChat</div>

  <button onclick="show('login')">Login</button>
  <button onclick="show('signup')">Create Account</button>

  <p>~ Developed by Conz ~</p>
</div>


<!-- 🔐 LOGIN -->
<div id="login" class="screen">
  <div class="header">
    <span onclick="show('welcome')">←</span>
    Login
  </div>

  <input id="li_user" placeholder="Username">
  <input id="li_pass" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
</div>


<!-- 🆕 SIGNUP -->
<div id="signup" class="screen">
  <div class="header">
    <span onclick="show('welcome')">←</span>
    Create Account
  </div>

  <input id="su_user" placeholder="Username">
  <input id="su_pass" type="password" placeholder="Password">

  <button onclick="signup()">Create</button>
</div>


<!-- 🏠 HOME -->
<div id="home" class="screen">
  <div class="header">
    <span onclick="logout()">Logout</span>
    ConzChat
    <span onclick="openSearch()">+</span>
  </div>

  <div id="chatList"></div>
</div>


<!-- 🔍 SEARCH USERS -->
<div id="search" class="screen">
  <div class="header">
    <span onclick="show('home')">←</span>
    Find Users
  </div>

  <input id="searchInput" placeholder="Search username..." oninput="searchUsers()">
  <div id="results"></div>
</div>


<!-- 💬 CHAT -->
<div id="chat" class="screen">
  <div class="header">
    <span onclick="show('home')">←</span>
    <span id="chatName">Chat</span>
    <span onclick="openProfile()">👤</span>
  </div>

  <div id="messages"></div>

  <div class="inputBar">
    <input id="msg" placeholder="Type a message...">
    <button onclick="send()">Send</button>
  </div>
</div>


<!-- 👤 PROFILE -->
<div id="profile" class="screen">
  <div class="header">
    <span onclick="show('home')">←</span>
    Profile
  </div>

  <h3 id="profileName"></h3>
  <input id="profilePic" placeholder="Profile picture URL">
  <button onclick="saveProfile()">Save</button>
</div>


<!-- 🔥 FIREBASE (ORDER MATTERS) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- YOUR FILES -->
<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
</html>
