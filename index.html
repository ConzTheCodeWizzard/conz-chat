<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="welcome" class="screen active">
  <h2>Welcome to</h2>
  <h1 class="title">ConzChat</h1>

  <button onclick="show('login')">Login</button>
  <button onclick="show('signup')">Create Account</button>

  <p>~ Developed by Conz ~</p>
</div>

<div id="login" class="screen">
  <h2>Login</h2>
  <input id="loginEmail" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">

  <button onclick="login()">Login</button>
  <button onclick="show('welcome')">Back</button>
</div>

<div id="signup" class="screen">
  <h2>Create Account</h2>

  <input id="signupUsername" placeholder="Username">
  <input id="signupEmail" placeholder="Email">
  <input id="signupPassword" type="password" placeholder="Password">

  <button onclick="signup()">Create</button>
  <button onclick="show('welcome')">Back</button>
</div>

<div id="home" class="screen">
  <div class="topbar">
    <span onclick="logout()">Logout</span>
    <span id="appTitle">ConzChat</span>
    <span onclick="openProfile()">👤</span>
  </div>

  <div id="chatList"></div>

  <div id="fab" onclick="toggleFab()">+</div>

  <div id="fabMenu">
    <div onclick="openSearch()">Find Friends</div>
    <div onclick="openSettings()">Settings</div>
    <div id="devBtn" style="display:none;" onclick="openDev()">Developer Options</div>
  </div>
</div>

<!-- DEV PANEL -->
<div id="dev" class="screen">
  <div class="topbar">
    <span onclick="show('home')">←</span>
    <span>Developer Panel</span>
  </div>

  <button onclick="loadAllUsers()">View Users</button>

  <div id="allUsers"></div>
</div>

<!-- SETTINGS -->
<div id="settings" class="screen">
  <div class="topbar">
    <span onclick="show('home')">←</span>
    <span>Settings</span>
  </div>

  <h3>Main Colour</h3>
  <input type="color" id="mainColorPicker">

  <h3>Secondary Colour</h3>
  <input type="color" id="secondaryColorPicker">

  <button onclick="saveTheme()">Save Theme</button>
  <button onclick="resetTheme()">Reset Colours</button>
</div>

<!-- SEARCH -->
<div id="search" class="screen">
  <div class="topbar">
    <span onclick="show('home')">←</span>
    <span>Find Users</span>
  </div>

  <input id="searchInput" placeholder="Search...">
  <button onclick="searchUsers()">Search</button>

  <div id="results"></div>
</div>

<!-- CHAT -->
<div id="chat" class="screen">
  <div class="topbar">
    <span onclick="show('home')">←</span>
    <span id="chatName"></span>
  </div>

  <div id="messages"></div>

  <input id="msgInput" placeholder="Message...">
  <button onclick="sendMessage()">Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase.js"></script>
<script src="app.js"></script>

</body>
</html>
